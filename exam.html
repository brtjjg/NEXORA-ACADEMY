<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Examination - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        /* ============================================
           ROOT & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b5;
            --secondary: #00d4aa;
            --dark: #1a1a2e;
            --dark-light: #2d2d44;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        body {
            background: var(--light-gray);
            color: var(--dark);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(12px);
            padding: 0 2rem;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            cursor: pointer;
        }
        .navbar .logo i {
            color: var(--secondary);
            font-size: 1.8rem;
        }
        .navbar .logo span {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-auth {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-auth .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-auth .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 60, 225, 0.35);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--dark);
        }
        .btn-secondary:hover {
            background: #00b894;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }
        .btn-success:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 0.8rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }
        .hamburger span {
            width: 28px;
            height: 3px;
            background: var(--white);
            border-radius: 4px;
            transition: var(--transition);
        }

        /* ============================================
           EXAM CONTAINER
           ============================================ */
        .exam-container {
            padding: 100px 2rem 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* ============================================
           EXAM CARD
           ============================================ */
        .exam-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
        }

        .exam-card .exam-header {
            text-align: center;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .exam-card .exam-header .exam-badge {
            display: inline-block;
            padding: 2px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--danger);
            color: white;
            margin-bottom: 0.5rem;
        }

        .exam-card .exam-header h2 {
            font-size: 1.6rem;
            color: var(--dark);
            margin-bottom: 0.3rem;
        }

        .exam-card .exam-header .exam-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .exam-card .exam-header .exam-meta span i {
            color: var(--primary);
            margin-right: 0.3rem;
        }

        /* ============================================
           ELIGIBILITY CHECK
           ============================================ */
        .eligibility-check {
            background: var(--light-gray);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .eligibility-check h4 {
            color: var(--dark);
            margin-bottom: 0.8rem;
        }

        .eligibility-check .eligibility-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 0.9rem;
        }

        .eligibility-check .eligibility-item:last-child {
            border-bottom: none;
        }

        .eligibility-check .eligibility-item .status-icon {
            font-size: 1.2rem;
        }

        .eligibility-check .eligibility-item .status-icon.valid {
            color: var(--success);
        }

        .eligibility-check .eligibility-item .status-icon.invalid {
            color: var(--danger);
        }

        /* ============================================
           SECURITY CHECK
           ============================================ */
        .security-check {
            background: #fff3e0;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-left: 4px solid var(--warning);
        }

        .security-check h4 {
            color: #e65100;
            margin-bottom: 0.5rem;
        }

        .security-check p {
            color: var(--gray);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .security-check .permission-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin: 0.8rem 0;
        }

        .security-check .permission-list .perm-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            padding: 0.3rem 0;
        }

        .security-check .permission-list .perm-item i {
            width: 20px;
        }

        .security-check .permission-list .perm-item .perm-status {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .security-check .permission-list .perm-item .perm-status.granted {
            color: var(--success);
        }

        .security-check .permission-list .perm-item .perm-status.denied {
            color: var(--danger);
        }

        /* ============================================
           SECURITY EVENTS
           ============================================ */
        .security-events {
            background: var(--white);
            border: 1px solid var(--light-gray);
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .security-events .event-item {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .security-events .event-item .event-text {
            color: var(--gray);
        }

        .security-events .event-item .event-time {
            color: var(--gray);
            font-size: 0.7rem;
        }

        /* ============================================
           QUESTION DISPLAY
           ============================================ */
        .question-area {
            margin: 1.5rem 0;
        }

        .question-area .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .question-area .question-header .question-number {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .question-area .question-header .timer {
            font-weight: 700;
            color: var(--danger);
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
        }

        .question-area .question-header .timer.warning {
            color: var(--danger);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .question-area .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--dark);
            line-height: 1.8;
        }

        .question-area .options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .question-area .options .option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            background: var(--light-gray);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .question-area .options .option:hover {
            background: #e8e8f0;
            border-color: var(--primary-light);
        }

        .question-area .options .option.selected {
            border-color: var(--primary);
            background: #f0ecff;
        }

        .question-area .options .option .option-letter {
            font-weight: 700;
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .question-area .options .option .option-text {
            flex: 1;
        }

        .question-area .options .option input[type="radio"] {
            display: none;
        }

        .question-area .question-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .question-area .question-actions .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        /* ============================================
           NAVIGATION GRID
           ============================================ */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 0.5rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: var(--light-gray);
            border-radius: 12px;
        }

        .nav-grid .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid var(--light-gray);
            background: var(--white);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .nav-grid .nav-btn:hover {
            border-color: var(--primary);
        }

        .nav-grid .nav-btn.answered {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .nav-grid .nav-btn.current {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .nav-grid .nav-btn.review {
            background: var(--warning);
            color: white;
            border-color: var(--warning);
        }

        .nav-grid .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ============================================
           RESULTS
           ============================================ */
        .results-card {
            text-align: center;
            padding: 2rem;
        }

        .results-card .result-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .results-card .result-icon.passed {
            color: var(--success);
        }

        .results-card .result-icon.failed {
            color: var(--danger);
        }

        .results-card .result-score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .results-card .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .results-card .result-details .detail-item {
            background: var(--light-gray);
            padding: 1rem;
            border-radius: 12px;
        }

        .results-card .result-details .detail-item .label {
            color: var(--gray);
            font-size: 0.8rem;
        }

        .results-card .result-details .detail-item .value {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--dark);
        }

        .results-card .result-status {
            display: inline-block;
            padding: 4px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 1rem 0;
        }

        .results-card .result-status.passed {
            background: #d4edda;
            color: #155724;
        }

        .results-card .result-status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .nav-links,
            .nav-auth .user-info .name {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .exam-container {
                padding: 80px 1rem 40px;
            }
            .exam-card {
                padding: 1.5rem;
            }
            .exam-card .exam-header h2 {
                font-size: 1.3rem;
            }
            .exam-card .exam-header .exam-meta {
                gap: 0.8rem;
                font-size: 0.8rem;
            }
            .security-check .permission-list {
                grid-template-columns: 1fr;
            }
            .question-area .question-actions .btn {
                flex: 1;
                min-width: 80px;
                font-size: 0.8rem;
                padding: 8px 12px;
            }
            .results-card .result-score {
                font-size: 2.2rem;
            }
            .results-card .result-details {
                grid-template-columns: 1fr 1fr;
            }
            .nav-grid {
                grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            }
            .nav-grid .nav-btn {
                width: 35px;
                height: 35px;
                font-size: 0.75rem;
            }
            .eligibility-check .eligibility-item {
                font-size: 0.8rem;
            }
            .nav-open .nav-links {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 72px;
                left: 0;
                right: 0;
                background: var(--dark);
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .nav-open .nav-links a {
                font-size: 1.1rem;
            }
            .nav-open .nav-auth .user-info .name {
                display: inline;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 1rem;
            }
            .exam-card {
                padding: 1rem;
            }
            .exam-card .exam-header h2 {
                font-size: 1.1rem;
            }
            .question-area .question-text {
                font-size: 0.95rem;
            }
            .question-area .options .option {
                padding: 0.6rem 0.8rem;
                font-size: 0.85rem;
            }
            .results-card .result-details {
                grid-template-columns: 1fr;
            }
            .security-check {
                padding: 1rem;
            }
            .security-check p {
                font-size: 0.8rem;
            }
        }

        .hidden {
            display: none !important;
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--white);
            z-index: 9999;
            padding: 80px 2rem 2rem;
            overflow-y: auto;
        }

        .fullscreen-mode .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10000;
        }

        .fullscreen-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .fullscreen-warning.active {
            display: flex;
        }

        .fullscreen-warning .icon {
            font-size: 4rem;
            color: var(--warning);
            margin-bottom: 1rem;
        }

        .fullscreen-warning h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .fullscreen-warning p {
            color: rgba(255, 255, 255, 0.7);
            max-width: 500px;
        }

        .connection-lost {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 99998;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .connection-lost.active {
            display: flex;
        }

        .connection-lost .icon {
            font-size: 4rem;
            color: var(--danger);
            margin-bottom: 1rem;
        }

        .connection-lost h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .connection-lost p {
            color: rgba(255, 255, 255, 0.7);
            max-width: 500px;
        }

        .connection-lost .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 1rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .attempts-remaining {
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .attempts-remaining .attempts-count {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- ==========================================
    FULLSCREEN WARNING
    ========================================== -->
    <div class="fullscreen-warning" id="fullscreenWarning">
        <div class="icon"><i class="fas fa-expand"></i></div>
        <h2>⚠️ Fullscreen Required</h2>
        <p>You must enter fullscreen mode to continue with the examination. Please click the button below.</p>
        <button class="btn btn-primary" style="margin-top:1.5rem;" onclick="enterFullscreen()">
            <i class="fas fa-expand"></i> Enter Fullscreen
        </button>
    </div>

    <!-- ==========================================
    CONNECTION LOST OVERLAY
    ========================================== -->
    <div class="connection-lost" id="connectionLost">
        <div class="icon"><i class="fas fa-wifi"></i></div>
        <h2>⚠️ Connection Lost</h2>
        <p>Your saved answers are being protected. Reconnect to continue.</p>
        <div class="spinner"></div>
        <p style="margin-top:1rem;font-size:0.8rem;color:rgba(255,255,255,0.5);">Attempting to reconnect...</p>
    </div>

    <!-- ==========================================
    NAVBAR
    ========================================== -->
    <nav class="navbar" id="navbar">
        <a href="dashboard.html" class="logo">
            <i class="fas fa-graduation-cap"></i>
            Nexora<span>Academy</span>
        </a>

        <ul class="nav-links" id="navLinks">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="dashboard.html">Courses</a></li>
        </ul>

        <div class="nav-auth">
            <div class="user-info">
                <div class="avatar" id="userAvatar">D</div>
                <span class="name" id="userName">Student</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div class="hamburger" onclick="toggleNav()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <!-- ==========================================
    TOAST
    ========================================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==========================================
    EXAM CONTENT
    ========================================== -->
    <div class="exam-container" id="examContainer">

        <div class="exam-card" id="examCard">

        // ============================================

        // ============================================
        function checkEligibility(userData) {
            const courseId = EXAM_DATA.courseId;
            const completed = userData?.completedLessons?.[courseId] || [];
            const course = { totalLessons: 85 }; // Would come from course data

            const items = [];
            let allValid = true;

            // Check lessons (80% of lessons completed)
            const lessonsComplete = completed.length >= Math.floor(course.totalLessons * 0.8);
            items.push({
                label: `Required lessons completed (${completed.length}/${course.totalLessons})`,
                valid: lessonsComplete
            });
            if (!lessonsComplete) allValid = false;

            // Check assignments (simulated)
            const assignmentsComplete = completed.length >= 20;
            items.push({
                label: 'Required assignments completed',
                valid: assignmentsComplete
            });
            if (!assignmentsComplete) allValid = false;

            // Check projects (simulated)
            const projectsComplete = completed.length >= 30;
            items.push({
                label: 'Required projects completed',
                valid: projectsComplete
            });
            if (!projectsComplete) allValid = false;

            // Check live classes (simulated)
            const liveClassesComplete = completed.length >= 10;
            items.push({
                label: 'Required live classes attended',
                valid: liveClassesComplete
            });
            if (!liveClassesComplete) allValid = false;

            // Check quizzes (simulated)
            const quizzesComplete = completed.length >= 15;
            items.push({
                label: 'Required quizzes completed',
                valid: quizzesComplete
            });
            if (!quizzesComplete) allValid = false;

            return {
                all: allValid,
                items: items
            };
        }

            // Check if fullscreen is required
            if (EXAM_DATA.security.fullscreen) {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    document.getElementById('fullscreenWarning').classList.add('active');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-play"></i> Start Exam';
                    return;
                }
            }

            // Check permissions if needed
            if (EXAM_DATA.security.camera || EXAM_DATA.security.microphone || EXAM_DATA.security.screenShare) {
                showToast('🔐 Please grant the required permissions when prompted.', 'info', 3000);
                // In a real implementation, we'd request permissions here
            }

            startExam();
        }

        // ============================================

        // ============================================
        function startExam() {
            examState.started = true;
            examState.startTime = new Date().toISOString();
            examState.timeRemaining = EXAM_DATA.timeLimit * 60;

            // Record attempt
            const user = getCurrentUser();
            const users = getUsers();
            const userData = users.find(u => u.id === user.id);
            if (userData) {
                if (!userData.examAttempts) userData.examAttempts = {};
                if (!userData.examAttempts[EXAM_DATA.id]) userData.examAttempts[EXAM_DATA.id] = 0;
                userData.examAttempts[EXAM_DATA.id]++;
                examState.attemptsUsed = userData.examAttempts[EXAM_DATA.id];
                saveUsers(users);
            }

            // Save exam state
            saveExamState();

            // Start timer
            examTimer = setInterval(updateTimer, 1000);

            // Start security monitoring
            startSecurityMonitoring();

            // Render first question
            renderExamQuestion();
            showToast('📝 Exam started! Good luck!', 'success');
        }

                                    <div class="option-letter">${letters[index]}</div>
                                    <div class="option-text">${opt}</div>
                                    <input type="radio" name="question_${q.id}" value="${index}" ${selected ? 'checked' : ''} />
                                </div>
                            `;
                });
                optionsHTML += '</div>';
            } else if (q.type === 'short_answer') {
                optionsHTML = `
                            <div style="margin-top:0.5rem;">
                                <textarea style="width:100%;padding:1rem;border:2px solid var(--light-gray);border-radius:10px;font-size:0.95rem;min-height:100px;resize:vertical;"
                                    id="shortAnswer_${q.id}" 
                                    placeholder="Type your answer here..."
                                    oninput="saveShortAnswer(${q.id}, this.value)">${examState.answers[q.id] || ''}</textarea>
                            </div>
                        `;
            }

            const timeStr = formatTime(examState.timeRemaining);

            card.innerHTML = `
                        <div class="exam-header">
                            <span class="exam-badge">${EXAM_DATA.type}</span>
                            <h2>${EXAM_DATA.title}</h2>
                            <div class="exam-meta">
                                <span><i class="fas fa-question-circle"></i> ${current + 1} of ${total}</span>
                                <span><i class="fas fa-check-circle"></i> Answered: ${answered}/${total}</span>
                                <span><i class="fas fa-clock"></i> Time: <span class="timer ${examState.timeRemaining < 300 ? 'warning' : ''}" id="examTimer">${timeStr}</span></span>
                            </div>
                        </div>

                        ${navHTML}

                        <div class="question-area">
                            <div class="question-header">
                                <span class="question-number">Question ${current + 1} of ${total}</span>
                                <span style="font-size:0.8rem;color:var(--gray);">
                                    ${isMarked ? '📌 Marked for Review' : ''}
                                    ${isAnswered ? '✅ Answered' : '⬜ Not Answered'}
                                </span>
                            </div>
                            <div class="question-text">${q.text}</div>
                            ${optionsHTML}
                            <div class="question-actions">
                                ${current > 0 ? `<button class="btn btn-secondary btn-sm" onclick="goToQuestion(${current - 1})"><i class="fas fa-arrow-left"></i> Previous</button>` : ''}
                                <button class="btn ${isMarked ? 'btn-warning' : 'btn-outline'} btn-sm" onclick="toggleMarkForReview(${q.id})" style="${isMarked ? 'background:var(--warning);color:white;' : ''}">
                                    <i class="fas fa-flag"></i> ${isMarked ? 'Unmark' : 'Mark for Review'}
                                </button>
                                ${current < total - 1 ? `<button class="btn btn-primary btn-sm" onclick="goToQuestion(${current + 1})">Save & Next <i class="fas fa-arrow-right"></i></button>` : ''}
                                ${current === total - 1 ? `<button class="btn btn-success btn-sm" onclick="submitExam()"><i class="fas fa-check"></i> Submit Exam</button>` : ''}
                            </div>
                        </div>

                        <!-- Security Events -->
                        <div style="margin-top:1rem;font-size:0.75rem;color:var(--gray);text-align:center;border-top:1px solid var(--light-gray);padding-top:0.8rem;">
                            <i class="fas fa-shield-alt"></i> 
                            Security Monitoring Active
                            ${examState.fullscreenExits > 0 ? `| Fullscreen Exits: ${examState.fullscreenExits}` : ''}
                            ${examState.tabSwitches > 0 ? `| Tab Switches: ${examState.tabSwitches}` : ''}
                        </div>
                    `;

            // Auto-save current answer
            saveExamState();
        }

        // ============================================
        // SELECT OPTION
        // ============================================
        function selectOption(questionId, optionIndex) {
            examState.answers[questionId] = optionIndex;
            saveExamState();
            renderExamQuestion();
        }

        // ============================================
        // SAVE SHORT ANSWER
        // ============================================
        function saveShortAnswer(questionId, value) {
            examState.answers[questionId] = value;
            saveExamState();
        }

        // ============================================
        // TOGGLE MARK FOR REVIEW
        // ============================================
        function toggleMarkForReview(questionId) {
            if (examState.markedForReview[questionId]) {
                delete examState.markedForReview[questionId];
            } else {
                examState.markedForReview[questionId] = true;
            }
            saveExamState();
            renderExamQuestion();
        }

        // ============================================
        // GO TO QUESTION
        // ============================================
        function goToQuestion(index) {
            examState.currentQuestion = index;
            saveExamState();
            renderExamQuestion();
        }

        // ============================================
        // UPDATE TIMER
        // ============================================
        function updateTimer() {
            examState.timeRemaining--;

            if (examState.timeRemaining <= 0) {
                clearInterval(examTimer);
                showToast('⏰ Time is up! Submitting automatically...', 'warning');
                submitExam();
                return;
            }

            const timerEl = document.getElementById('examTimer');
            if (timerEl) {
                timerEl.textContent = formatTime(examState.timeRemaining);
                if (examState.timeRemaining < 300) {
                    timerEl.classList.add('warning');
                }
            }

            // Auto-save every 30 seconds
            if (examState.timeRemaining % 30 === 0) {
                saveExamState();
            }
        }

        // ============================================
        // FORMAT TIME
        // ============================================
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // ============================================
        // SAVE EXAM STATE
        // ============================================
        function saveExamState() {
            localStorage.setItem('nexora_exam_state_' + EXAM_DATA.id, JSON.stringify(examState));
        }

        // ============================================
        // SUBMIT EXAM
        // ============================================
        function submitExam() {
            if (examState.submitted) return;

            // Confirm submission
            if (!confirm('Are you sure you want to submit your examination? You cannot change your answers after submission.')) {
                return;
            }

            clearInterval(examTimer);
            clearInterval(securityTimer);

            examState.submitted = true;
            examState.endTime = new Date().toISOString();

            // Calculate results
            const results = calculateResults();
            examState.results = results;

            // Update user progress
            updateUserProgress(results);

            saveExamState();

            // Stop security monitoring
            stopSecurityMonitoring();

            showToast('📝 Exam submitted successfully!', 'success');
            renderResults();
        }

        // ============================================
        // CALCULATE RESULTS
        // ============================================
        function calculateResults() {
            const questions = EXAM_DATA.questions;
            let correct = 0;
            let total = questions.length;
            let answered = 0;

            questions.forEach(q => {
                const answer = examState.answers[q.id];
                if (answer !== undefined) {
                    answered++;
                    if (q.type === 'multiple_choice' || q.type === 'true_false') {
                        if (answer === q.correct) correct++;
                    }
                    // For short answer, we'd need manual marking
                }
            });

            const score = total > 0 ? (correct / total) * 100 : 0;
            const passed = score >= EXAM_DATA.passMark;

            return {
                correct,
                total,
                answered,
                score: Math.round(score * 100) / 100,
                passed,
                passMark: EXAM_DATA.passMark,
                timeUsed: EXAM_DATA.timeLimit * 60 - examState.timeRemaining
            };
        }

        // ============================================
        // UPDATE USER PROGRESS
        // ============================================
        function updateUserProgress(results) {
            const user = getCurrentUser();
            if (!user) return;

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);
            if (!userData) return;

            // Store exam result
            if (!userData.examResults) userData.examResults = {};
            userData.examResults[EXAM_DATA.id] = {
                score: results.score,
                passed: results.passed,
                correct: results.correct,
                total: results.total,
                date: new Date().toISOString(),
                attempts: examState.attemptsUsed
            };

            // Update learning hours
            userData.learningHours = (userData.learningHours || 0) + 0.5;

            saveUsers(users);
            setCurrentUser(userData);
        }

        // ============================================
        // RENDER RESULTS
        // ============================================
        function renderResults() {
            const card = document.getElementById('examCard');
            const results = examState.results || {};

            const passed = results.passed || false;
            const score = results.score || 0;
            const correct = results.correct || 0;
            const total = results.total || EXAM_DATA.questions.length;
            const answered = results.answered || 0;
            const timeUsed = results.timeUsed || 0;

            const timeStr = formatTime(timeUsed);

            card.innerHTML = `
                        <div class="results-card">
                            <div class="result-icon ${passed ? 'passed' : 'failed'}">
                                <i class="fas ${passed ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                            </div>
                            <h2>${passed ? '🎉 EXAM COMPLETED' : '📝 EXAM COMPLETED'}</h2>
                            <div class="result-score">${score}%</div>
                            <div class="result-status ${passed ? 'passed' : 'failed'}">
                                ${passed ? '✅ PASSED' : '❌ NOT PASSED'}
                            </div>

                            <div class="result-details">
                                <div class="detail-item">
                                    <div class="label">Correct</div>
                                    <div class="value">${correct}/${total}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">Time Used</div>
                                    <div class="value">${timeStr}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">Pass Mark</div>
                                    <div class="value">${EXAM_DATA.passMark}%</div>
                                </div>
                                <div class="detail-item">
                                    <div class="label">Status</div>
                                    <div class="value" style="color:${passed ? 'var(--success)' : 'var(--danger)'}">
                                        ${passed ? '✅ Passed' : '❌ Failed'}
                                    </div>
                                </div>
                            </div>

                            ${!passed && examState.attemptsUsed < EXAM_DATA.maxAttempts ? `
                                <div style="margin-top:1.5rem;">
                                    <p style="color:var(--gray);font-size:0.9rem;">Attempts Remaining: ${EXAM_DATA.maxAttempts - examState.attemptsUsed}</p>
                                    <button class="btn btn-primary" onclick="retakeExam()">
                                        <i class="fas fa-redo"></i> Retake Exam
                                    </button>
                                </div>
                            ` : ''}

                            ${!passed && examState.attemptsUsed >= EXAM_DATA.maxAttempts ? `
                                <div style="margin-top:1.5rem;padding:1rem;background:#f8d7da;border-radius:12px;color:#721c24;">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    You have used all available attempts. Please contact academic support.
                                </div>
                            ` : ''}

                            ${passed ? `
                                <div style="margin-top:1.5rem;">
                                    <div style="padding:1rem;background:#d4edda;border-radius:12px;color:#155724;margin-bottom:0.8rem;">
                                        <i class="fas fa-check-circle"></i>
                                        Congratulations! You passed the exam. Your progress has been updated.
                                    </div>
                                    <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                        <i class="fas fa-arrow-left"></i> Return to Dashboard
                                    </button>
                                    <button class="btn btn-secondary" onclick="window.location.href='certificate.html?course=${EXAM_DATA.courseId}'">
                                        <i class="fas fa-certificate"></i> View Certificate
                                    </button>
                                </div>
                            ` : `
                                <div style="margin-top:1.5rem;">
                                    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                                        <i class="fas fa-arrow-left"></i> Return to Dashboard
                                    </button>
                                </div>
                            `}
                        </div>
                    `;
        }

        // ============================================
        // RETAKE EXAM
        // ============================================
        function retakeExam() {
            if (examState.attemptsUsed >= EXAM_DATA.maxAttempts) {
                showToast('No attempts remaining.', 'error');
                return;
            }

            // Reset exam state
            examState.currentQuestion = 0;
            examState.answers = {};
            examState.markedForReview = {};
            examState.timeRemaining = EXAM_DATA.timeLimit * 60;
            examState.started = false;
            examState.submitted = false;
            examState.securityEvents = [];
            examState.fullscreenExits = 0;
            examState.tabSwitches = 0;
            examState.faceAlerts = 0;
            examState.rightClickAttempts = 0;
            examState.copyAttempts = 0;

            // Regenerate questions
            generateQuestions();

            saveExamState();
            renderExam();
            showToast('🔄 Exam reset. Good luck!', 'info');
        }

        // ============================================
        // SECURITY MONITORING
        // ============================================
        function startSecurityMonitoring() {
            // Fullscreen change detection
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

            // Visibility change (tab switching)
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // Right click prevention
            document.addEventListener('contextmenu', handleRightClick);

            // Copy prevention
            document.addEventListener('copy', handleCopy);

            // Paste prevention
            document.addEventListener('paste', handlePaste);

            // Cut prevention
            document.addEventListener('cut', handleCut);

            // Face detection simulation (would use camera API in production)
            setInterval(simulateFaceDetection, 30000);
        }

        function stopSecurityMonitoring() {
            document.removeEventListener('fullscreenchange', handleFullscreenChange);
            document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            document.removeEventListener('contextmenu', handleRightClick);
            document.removeEventListener('copy', handleCopy);
            document.removeEventListener('paste', handlePaste);
            document.removeEventListener('cut', handleCut);
        }

        function handleFullscreenChange() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFullscreen && EXAM_DATA.security.fullscreen) {
                examState.fullscreenExits++;
                examState.securityEvents.push({
                    type: 'fullscreen_exit',
                    time: new Date().toISOString(),
                    count: examState.fullscreenExits
                });

                if (examState.fullscreenExits >= 3) {
                    showToast('⚠️ Multiple fullscreen exits detected. Exam may be flagged.', 'warning');
                }

                // Re-enter fullscreen
                if (examState.fullscreenExits < 3) {
                    document.getElementById('fullscreenWarning').classList.add('active');
                }

                saveExamState();
            }
        }

        function handleVisibilityChange() {
            if (document.hidden) {
                examState.tabSwitches++;
                examState.securityEvents.push({
                    type: 'tab_switch',
                    time: new Date().toISOString(),
                    count: examState.tabSwitches
                });

                if (examState.tabSwitches >= 3) {
                    showToast('⚠️ Multiple tab switches detected.', 'warning');
                }

                saveExamState();
            }
        }

        function handleRightClick(e) {
            e.preventDefault();
            examState.rightClickAttempts++;
            examState.securityEvents.push({
                type: 'right_click',
                time: new Date().toISOString(),
                count: examState.rightClickAttempts
            });
            saveExamState();
            showToast('⚠️ Right-click is disabled during the exam.', 'warning', 1500);
        }

        function handleCopy(e) {
            e.preventDefault();
            examState.copyAttempts++;
            examState.securityEvents.push({
                type: 'copy_attempt',
                time: new Date().toISOString(),
                count: examState.copyAttempts
            });
            saveExamState();
            showToast('⚠️ Copy is disabled during the exam.', 'warning', 1500);
        }

        function handlePaste(e) {
            e.preventDefault();
            showToast('⚠️ Paste is disabled during the exam.', 'warning', 1500);
        }

        function handleCut(e) {
            e.preventDefault();
            showToast('⚠️ Cut is disabled during the exam.', 'warning', 1500);
        }

        function simulateFaceDetection() {
            if (!examState.started || examState.submitted) return;
            // Simulate face detection - in production this would use actual camera feed
            const detected = Math.random() > 0.1;
            if (!detected) {
                examState.faceAlerts++;
                examState.securityEvents.push({
                    type: 'no_face',
                    time: new Date().toISOString(),
                    count: examState.faceAlerts
                });
                saveExamState();
                if (examState.faceAlerts % 2 === 0) {
                    showToast('⚠️ Face not detected. Please ensure you are visible.', 'warning');
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const user = getCurrentUser();
            if (!user) {
                // Store redirect URL
                sessionStorage.setItem('nexora_redirect_url', window.location.href);
                window.location.href = 'index.html';
                return;
            }

            // Generate questions
            generateQuestions();

            // Render exam
            renderExam();

            // Close mobile nav on link click
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('nav-open');
                });
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (examState.started && !examState.submitted) {
                    if (e.key === 'Escape') {
                        // Handle escape if needed
                    }
                }
            });

            // Connection monitoring
            window.addEventListener('online', function() {
                document.getElementById('connectionLost').classList.remove('active');
                showToast('✅ Connection restored.', 'success');
            });

            window.addEventListener('offline', function() {
                document.getElementById('connectionLost').classList.add('active');
                showToast('⚠️ Connection lost. Your answers are being saved.', 'warning');
            });

            // Save state periodically
            setInterval(saveExamState, 15000);
        });

        console.log('📝 Nexora Academy - Examination System');
        console.log(`📊 Exam: ${EXAM_DATA.title}`);
        console.log(`📖 Questions: ${EXAM_DATA.totalQuestions}`);
        console.log(`⏱️ Time Limit: ${EXAM_DATA.timeLimit} minutes`);
        console.log(`✅ Pass Mark: ${EXAM_DATA.passMark}%`);
        console.log('🔐 Security monitoring active');
        console.log('✅ Full integration with progress, transcript, and certificate systems');
    </script>

</body>
</html>
