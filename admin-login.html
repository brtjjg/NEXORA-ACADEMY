<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Admin Login - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b5;
            --secondary: #00d4aa;
            --dark: #1a1a2e;
            --dark-light: #2d2d44;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        /* ============================================
           LOGO
           ============================================ */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--white);
        }

        .logo h1 i {
            color: var(--secondary);
        }

        .logo h1 span {
            color: var(--secondary);
        }

        .logo .badge {
            display: inline-block;
            background: var(--danger);
            color: white;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.3rem;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        /* ============================================
           LOGIN CARD
           ============================================ */
        .login-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        }

        .login-card .card-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.3rem;
        }

        .login-card .card-subtitle {
            text-align: center;
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* ============================================
           FORM
           ============================================ */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            color: var(--dark);
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.1);
        }

        .form-group .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--gray);
            transition: all 0.3s ease;
        }

        .form-group .password-toggle:hover {
            color: var(--dark);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .form-options .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            cursor: pointer;
        }

        .form-options .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-options .forgot {
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
        }

        .form-options .forgot:hover {
            text-decoration: underline;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 60, 225, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #00b894;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            width: auto;
        }

        /* ============================================
           2FA OVERLAY
           ============================================ */
        .twofa-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .twofa-overlay.active {
            display: flex;
        }

        .twofa-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .twofa-card .icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .twofa-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .twofa-card p {
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .twofa-card .code-inputs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .twofa-card .code-inputs input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid var(--light-gray);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .twofa-card .code-inputs input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.1);
        }

        .twofa-card .resend {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .twofa-card .resend a {
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
        }

        .twofa-card .resend a:hover {
            text-decoration: underline;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }

            .logo h1 {
                font-size: 1.6rem;
            }

            .twofa-card {
                padding: 1.5rem;
            }

            .twofa-card .code-inputs input {
                width: 42px;
                height: 48px;
                font-size: 1.2rem;
            }
        }

        .hidden {
            display: none !important;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    2FA OVERLAY
    ========================================== -->
    <div class="twofa-overlay" id="twofaOverlay">
        <div class="twofa-card">
            <div class="icon"><i class="fas fa-shield-alt"></i></div>
            <h3>Two-Factor Authentication</h3>
            <p>Enter the 6-digit code sent to your email</p>
            <div class="code-inputs">
                <input type="text" maxlength="1" id="code1" oninput="moveNext(this, 'code2')" />
                <input type="text" maxlength="1" id="code2" oninput="moveNext(this, 'code3')" />
                <input type="text" maxlength="1" id="code3" oninput="moveNext(this, 'code4')" />
                <input type="text" maxlength="1" id="code4" oninput="moveNext(this, 'code5')" />
                <input type="text" maxlength="1" id="code5" oninput="moveNext(this, 'code6')" />
                <input type="text" maxlength="1" id="code6" oninput="verify2FA()" />
            </div>
            <div class="resend">
                Didn't receive code? <a onclick="resendCode()">Resend</a>
            </div>
            <button class="btn btn-primary" style="margin-top:1rem;" onclick="verify2FA()">
                <i class="fas fa-check"></i> Verify
            </button>
            <button class="btn btn-outline" style="margin-top:0.5rem;" onclick="cancel2FA()">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>

    <!-- ==========================================
    TOAST CONTAINER
    ========================================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==========================================
    LOGIN FORM
    ========================================== -->
    <div class="login-container">
        <div class="logo">
            <h1><i class="fas fa-graduation-cap"></i> Nexora<span>Academy</span></h1>
            <span class="badge"><i class="fas fa-shield-alt"></i> Admin</span>
            <p>Secure Administrator Login</p>
        </div>

        <div class="login-card">
            <div class="card-title">🔐 Admin Login</div>
            <div class="card-subtitle">Enter your credentials to access the admin panel</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email or Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="adminEmail" placeholder="admin@nexoraacademy.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="adminPassword" placeholder="Enter your password" required />
                        <span class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordIcon"></i>
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" />
                        Remember me
                    </label>
                    <a class="forgot" onclick="forgotPassword()">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div style="text-align:center;margin-top:1rem;font-size:0.8rem;color:var(--gray);">
                <i class="fas fa-shield-alt"></i> Protected by Two-Factor Authentication
            </div>
        </div>
    </div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        // ============================================
        // ADMIN DATA
        // ============================================
        const ADMINS = [{
            id: 1,
            name: 'Super Admin',
            email: 'admin@nexoraacademy.com',
            username: 'superadmin',
            password: 'Nexora@2026!Secure',
            role: 'super_admin',
            permissions: ['all']
        }, {
            id: 2,
            name: 'Academic Admin',
            email: 'academic@nexoraacademy.com',
            username: 'academic',
            password: 'Academic@2026!',
            role: 'academic_admin',
            permissions: ['courses', 'modules', 'lessons', 'assignments', 'projects', 'tutors', 'live_classes',
                'certificates'
            ]
        }, {
            id: 3,
            name: 'Finance Admin',
            email: 'finance@nexoraacademy.com',
            username: 'finance',
            password: 'Finance@2026!',
            role: 'finance_admin',
            permissions: ['payments', 'fees', 'refunds', 'scholarships', 'reports']
        }, {
            id: 4,
            name: 'Certificate Admin',
            email: 'certificates@nexoraacademy.com',
            username: 'certificates',
            password: 'Cert@2026!Secure',
            role: 'certificate_admin',
            permissions: ['certificates', 'transcripts', 'qr_codes', 'verification', 'reissuance']
        }, {
            id: 5,
            name: 'Support Admin',
            email: 'support@nexoraacademy.com',
            username: 'support',
            password: 'Support@2026!',
            role: 'support_admin',
            permissions: ['support_tickets', 'password_reset', 'user_support']
        }];

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============================================
        // PASSWORD TOGGLE
        // ============================================
        function togglePassword() {
            const input = document.getElementById('adminPassword');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================
        // 2FA INPUT HANDLING
        // ============================================
        function moveNext(current, nextId) {
            if (current.value.length === 1) {
                const next = document.getElementById(nextId);
                if (next) next.focus();
            }
        }

        // ============================================
        // FORGOT PASSWORD
        // ============================================
        function forgotPassword() {
            showToast('📧 Password reset link sent to your email', 'info');
        }

        // ============================================
        // RESEND 2FA CODE
        // ============================================
        function resendCode() {
            showToast('📧 New 2FA code sent to your email', 'info');
            // Auto-fill demo code
            const code = '123456';
            for (let i = 0; i < 6; i++) {
                const el = document.getElementById(`code${i+1}`);
                if (el) el.value = code[i];
            }
            showToast('📱 Demo code: 123456', 'info', 3000);
        }

        // ============================================
        // CANCEL 2FA
        // ============================================
        function cancel2FA() {
            document.getElementById('twofaOverlay').classList.remove('active');
            // Clear code inputs
            for (let i = 1; i <= 6; i++) {
                const el = document.getElementById(`code${i}`);
                if (el) el.value = '';
            }
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }

        // ============================================
        // VERIFY 2FA
        // ============================================
        function verify2FA() {
            let code = '';
            for (let i = 1; i <= 6; i++) {
                const el = document.getElementById(`code${i}`);
                if (el) code += el.value;
            }

            if (code.length !== 6) {
                showToast('Please enter the complete 6-digit code.', 'warning');
                return;
            }

            // Demo: accept any 6-digit code
            if (code.match(/^\d{6}$/)) {
                document.getElementById('twofaOverlay').classList.remove('active');
                showToast('✅ 2FA Verified! Redirecting to dashboard...', 'success');

                // Log activity
                logAdminActivity('login', 'Admin logged in successfully');

                // Redirect to admin dashboard
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1500);
            } else {
                showToast('❌ Invalid code. Please try again.', 'error');
            }
        }

        // ============================================
        // LOGIN HANDLER
        // ============================================
        let failedAttempts = 0;
        let loginLocked = false;

        function handleLogin(e) {
            e.preventDefault();

            if (loginLocked) {
                showToast('🔒 Account temporarily locked. Please try again later.', 'error');
                return;
            }

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!email || !password) {
                showToast('Please enter email/username and password.', 'warning');
                return;
            }

            // Find admin
            const admin = ADMINS.find(a =>
                a.email === email ||
                a.username === email
            );

            if (!admin || admin.password !== password) {
                failedAttempts++;
                showToast(`❌ Invalid credentials. Attempt ${failedAttempts}/5`, 'error');

                if (failedAttempts >= 5) {
                    loginLocked = true;
                    showToast('🔒 Account locked due to multiple failed attempts. Please try again later.', 'error');
                    setTimeout(() => {
                        loginLocked = false;
                        failedAttempts = 0;
                    }, 300000); // 5 minutes
                }
                return;
            }

            // Successful login - proceed to 2FA
            showToast('✅ Credentials verified. Sending 2FA code...', 'success');

            // Disable login button
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').innerHTML = '<span class="spinner"></span> Verifying...';

            // Send login notification
            sendLoginNotification(admin);

            // Show 2FA overlay after short delay
            setTimeout(() => {
                // Auto-fill demo code for testing
                setTimeout(() => {
                    const demoCode = '123456';
                    for (let i = 0; i < 6; i++) {
                        const el = document.getElementById(`code${i+1}`);
                        if (el) el.value = demoCode[i];
                    }
                }, 500);

                document.getElementById('twofaOverlay').classList.add('active');
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';

                showToast('📱 2FA code sent to your email (Demo: 123456)', 'info', 3000);
            }, 1500);

            // Store admin session
            localStorage.setItem('nexora_admin', JSON.stringify({
                id: admin.id,
                name: admin.name,
                email: admin.email,
                role: admin.role,
                permissions: admin.permissions,
                loginTime: new Date().toISOString()
            }));

            // Remember me
            if (rememberMe) {
                localStorage.setItem('nexora_admin_remember', admin.email);
            }
        }

        // ============================================
        // SEND LOGIN NOTIFICATION
        // ============================================
        function sendLoginNotification(admin) {
            const device = navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop';
            const browser = navigator.userAgent.includes('Chrome') ? 'Chrome' :
                navigator.userAgent.includes('Firefox') ? 'Firefox' :
                navigator.userAgent.includes('Safari') ? 'Safari' : 'Unknown';

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            // Simulate email notification
            console.log(`📧 Login Notification Sent:
            Account: ${admin.email}
            Date: ${dateStr} at ${timeStr}
            Device: ${browser} on ${device}
            Location: Nairobi, Kenya (approximate)`);

            showToast('📧 Login notification sent to admin email', 'info', 3000);
        }

        // ============================================
        // LOG ADMIN ACTIVITY
        // ============================================
        function logAdminActivity(action, details) {
            const logs = JSON.parse(localStorage.getItem('nexora_admin_logs') || '[]');
            logs.push({
                id: Date.now(),
                time: new Date().toISOString(),
                admin: 'System',
                action: action,
                details: details
            });
            localStorage.setItem('nexora_admin_logs', JSON.stringify(logs));
        }

        // ============================================
        // CHECK REMEMBER ME
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const remembered = localStorage.getItem('nexora_admin_remember');
            if (remembered) {
                document.getElementById('adminEmail').value = remembered;
                document.getElementById('rememberMe').checked = true;
            }

            // Auto-focus email field
            document.getElementById('adminEmail').focus();

            // Handle enter key on 2FA inputs
            document.querySelectorAll('.code-inputs input').forEach((input, index) => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '') {
                        const prev = document.getElementById(`code${index}`);
                        if (prev) prev.focus();
                    }
                });
            });
        });

        console.log('🔐 Nexora Academy - Admin Login System');
        console.log('👑 Super Admin: admin@nexoraacademy.com / Nexora@2026!Secure');
        console.log('📱 2FA Demo Code: 123456');
        console.log('✅ All admin roles configured');
    </script>

</body>
  </html>
