<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Certificate - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #0B1F3A;
            --navy-light: #1a3a5c;
            --blue: #2563EB;
            --gold: #D4AF37;
            --gold-light: #e8d5a3;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
        }

        body {
            background: var(--light-gray);
            min-height: 100vh;
            padding: 0.8rem;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            background: var(--navy);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar .logo {
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
        }

        .navbar .logo i {
            color: var(--gold);
        }

        .navbar .logo span {
            color: var(--gold);
        }

        .navbar .back-btn {
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar .back-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           CERTIFICATE - PROFESSIONAL DESIGN
           ============================================ */
        .certificate-wrapper {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            position: relative;
        }

        .certificate {
            background: var(--white);
            padding: 2.5rem 2.5rem 2rem;
            position: relative;
            border: 4px solid var(--navy);
            border-radius: 8px;
            min-height: 600px;
        }

        /* Outer decorative border */
        .certificate::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 2px solid var(--gold);
            border-radius: 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Inner decorative border */
        .certificate::after {
            content: '';
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border: 1px solid rgba(11, 31, 58, 0.08);
            border-radius: 2px;
            pointer-events: none;
        }

        /* Watermark */
        .certificate .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 8rem;
            color: rgba(11, 31, 58, 0.02);
            font-weight: 900;
            pointer-events: none;
            letter-spacing: 20px;
            user-select: none;
            font-family: 'Georgia', serif;
        }

        /* Gold corner decorations */
        .certificate .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: var(--gold);
            border-style: solid;
            border-width: 0;
            opacity: 0.5;
        }

        .certificate .corner.tl {
            top: 20px;
            left: 20px;
            border-top-width: 3px;
            border-left-width: 3px;
        }

        .certificate .corner.tr {
            top: 20px;
            right: 20px;
            border-top-width: 3px;
            border-right-width: 3px;
        }

        .certificate .corner.bl {
            bottom: 20px;
            left: 20px;
            border-bottom-width: 3px;
            border-left-width: 3px;
        }

        .certificate .corner.br {
            bottom: 20px;
            right: 20px;
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .certificate .header {
            text-align: center;
            border-bottom: 2px solid var(--navy);
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
            position: relative;
        }

        .certificate .header .logo-text {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--navy);
            letter-spacing: 4px;
            font-family: 'Georgia', serif;
        }

        .certificate .header .logo-text i {
            color: var(--gold);
        }

        .certificate .header .logo-text span {
            color: var(--gold);
        }

        .certificate .header .tagline {
            font-size: 0.7rem;
            color: var(--gray);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 0.1rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
        }

        .certificate .header .cert-number-top {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.6rem;
            color: var(--gray);
            font-weight: 600;
            letter-spacing: 1px;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .header .cert-number-top span {
            color: var(--navy);
        }

        /* ============================================
           TITLE
           ============================================ */
        .certificate .title {
            text-align: center;
            margin: 0.5rem 0 0.8rem;
        }

        .certificate .title h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            letter-spacing: 6px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
        }

        .certificate .title .gold-line {
            width: 80px;
            height: 3px;
            background: var(--gold);
            margin: 0.3rem auto;
            border-radius: 2px;
        }

        /* ============================================
           BODY
           ============================================ */
        .certificate .body {
            text-align: center;
            padding: 0.5rem 0;
        }

        .certificate .body .presented-text {
            font-size: 0.9rem;
            color: var(--gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .body .student-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--navy);
            margin: 0.3rem 0 0.1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
        }

        .certificate .body .for-text {
            color: var(--gray);
            font-size: 0.85rem;
            margin: 0.1rem 0;
            font-family: 'Georgia', serif;
        }

        .certificate .body .course-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--navy);
            margin: 0.2rem 0 0.3rem;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }

        .certificate .body .achievement-text {
            font-size: 0.85rem;
            color: var(--gray);
            max-width: 600px;
            margin: 0.5rem auto;
            line-height: 1.8;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* ============================================
           GRADE / RESULT
           ============================================ */
        .certificate .body .result-section {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 0.8rem 0;
            flex-wrap: wrap;
        }

        .certificate .body .result-section .result-item {
            background: var(--light-gray);
            padding: 0.3rem 1.5rem;
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--gray);
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .body .result-section .result-item .value {
            font-weight: 700;
            color: var(--navy);
            font-size: 0.95rem;
        }

        .certificate .body .result-section .result-item .value.distinction {
            color: var(--gold);
        }

        /* ============================================
           COMPLETION DATE
           ============================================ */
        .certificate .body .completion-date {
            font-size: 0.85rem;
            color: var(--gray);
            margin: 0.5rem 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .body .completion-date span {
            color: var(--navy);
            font-weight: 600;
        }

        /* ============================================
           FOOTER / SIGNATURES
           ============================================ */
        .certificate .footer-signatures {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 2px solid var(--light-gray);
            position: relative;
        }

        .certificate .footer-signatures .signature {
            text-align: center;
            flex: 1;
        }

        .certificate .footer-signatures .signature .sig-line {
            width: 150px;
            height: 2px;
            background: var(--navy);
            margin: 0.5rem auto 0.2rem;
        }

        .certificate .footer-signatures .signature .sig-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--navy);
            font-family: 'Georgia', serif;
        }

        .certificate .footer-signatures .signature .sig-title {
            font-size: 0.65rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ============================================
           DIGITAL SECURITY STAMP
           ============================================ */
        .certificate .digital-stamp {
            position: absolute;
            bottom: 80px;
            left: 40px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px double var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.05);
            padding: 0.2rem;
            text-align: center;
        }

        .certificate .digital-stamp .stamp-icon {
            font-size: 1.2rem;
            color: var(--gold);
        }

        .certificate .digital-stamp .stamp-text {
            font-size: 0.4rem;
            color: var(--navy);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .digital-stamp .stamp-year {
            font-size: 0.5rem;
            color: var(--gold);
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ============================================
           QR CODE SECTION
           ============================================ */
        .certificate .qr-section {
            position: absolute;
            bottom: 30px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .certificate .qr-section .qr-code {
            width: 80px;
            height: 80px;
            background: var(--white);
            border: 2px solid var(--light-gray);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 4px;
        }

        .certificate .qr-section .qr-code canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .certificate .qr-section .qr-info {
            text-align: right;
        }

        .certificate .qr-section .qr-info .qr-label {
            font-size: 0.6rem;
            color: var(--gray);
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .qr-section .qr-info .qr-label i {
            color: var(--gold);
        }

        .certificate .qr-section .qr-info .qr-status {
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--success);
            font-family: 'Segoe UI', sans-serif;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .certificate .cert-footer {
            text-align: center;
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--light-gray);
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate .cert-footer .footer-text {
            font-size: 0.6rem;
            color: var(--gray);
            letter-spacing: 1px;
        }

        .certificate .cert-footer .footer-text a {
            color: var(--blue);
            text-decoration: none;
        }

        .certificate .cert-footer .footer-text a:hover {
            text-decoration: underline;
        }

        .certificate .cert-footer .footer-cert-number {
            font-size: 0.6rem;
            color: var(--gray);
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .certificate .cert-footer .footer-cert-number span {
            color: var(--navy);
        }

        /* ============================================
           ACTIONS
           ============================================ */
        .actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-width: 140px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--navy);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--navy-light);
        }

        .btn-secondary {
            background: var(--gold);
            color: var(--white);
        }

        .btn-secondary:hover {
            background: #c49a2e;
        }

        .btn-outline {
            background: transparent;
            color: var(--navy);
            border: 2px solid var(--navy);
        }

        .btn-outline:hover {
            background: var(--navy);
            color: var(--white);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            min-width: 100px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: var(--navy);
            color: var(--white);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            font-size: 0.9rem;
            pointer-events: auto;
            font-family: 'Segoe UI', sans-serif;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid #f39c12;
        }
        .toast.info {
            border-left: 4px solid var(--blue);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           NO CERTIFICATE
           ============================================ */
        .no-certificate {
            text-align: center;
            padding: 3rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .no-certificate i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .no-certificate h3 {
            color: var(--navy);
            margin-bottom: 0.5rem;
        }

        .no-certificate p {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        /* ============================================
           LOADING
           ============================================ */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 4000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-overlay p {
            color: var(--white);
            margin-top: 1rem;
            font-size: 1rem;
            font-family: 'Segoe UI', sans-serif;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .certificate-wrapper {
                padding: 1rem;
            }

            .certificate {
                padding: 1.5rem 1rem 1rem;
                min-height: 400px;
            }

            .certificate .header .logo-text {
                font-size: 1.4rem;
            }

            .certificate .header .cert-number-top {
                position: static;
                text-align: center;
                display: block;
                margin-top: 0.3rem;
                font-size: 0.55rem;
            }

            .certificate .title h1 {
                font-size: 1.3rem;
                letter-spacing: 3px;
            }

            .certificate .body .student-name {
                font-size: 1.8rem;
                letter-spacing: 3px;
            }

            .certificate .body .course-name {
                font-size: 1.2rem;
            }

            .certificate .body .achievement-text {
                font-size: 0.75rem;
            }

            .certificate .footer-signatures {
                flex-direction: column;
                align-items: center;
                gap: 0.8rem;
            }

            .certificate .footer-signatures .signature .sig-line {
                width: 100px;
            }

            .certificate .digital-stamp {
                display: none;
            }

            .certificate .qr-section {
                position: static;
                justify-content: center;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--light-gray);
            }

            .certificate .qr-section .qr-info {
                text-align: left;
            }

            .certificate .qr-section .qr-code {
                width: 60px;
                height: 60px;
            }

            .certificate .corner {
                display: none;
            }

            .certificate .watermark {
                font-size: 3rem;
                letter-spacing: 10px;
            }

            .certificate .body .result-section {
                gap: 0.8rem;
            }

            .certificate .body .result-section .result-item {
                padding: 0.2rem 1rem;
                font-size: 0.7rem;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
                min-width: auto;
            }

            .container {
                padding: 0;
            }

            body {
                padding: 0.5rem;
            }

            .toast {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .certificate-wrapper {
                padding: 0.5rem;
            }

            .certificate {
                padding: 1rem 0.6rem 0.8rem;
                border-width: 3px;
            }

            .certificate .header .logo-text {
                font-size: 1.1rem;
            }

            .certificate .title h1 {
                font-size: 1rem;
            }

            .certificate .body .student-name {
                font-size: 1.3rem;
            }

            .certificate .body .course-name {
                font-size: 1rem;
            }

            .certificate .qr-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .certificate .qr-section .qr-info {
                text-align: center;
            }
        }

        .hidden {
            display: none !important;
        }

        .mt-1 {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Generating Certificate...</p>
    </div>

    <div class="container">

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-graduation-cap"></i>
                Nexora<span>Academy</span>
            </div>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </div>
        </nav>

        <!-- Certificate -->
        <div class="certificate-wrapper" id="certificateWrapper">
            <div id="certificateContainer">
                <!-- Dynamic certificate content -->
            </div>
        </div>

        <!-- Actions -->
        <div class="actions" id="actionsContainer">
            <button class="btn btn-primary" onclick="downloadPDF()" id="downloadBtn">
                <i class="fas fa-download"></i> Download PDF
            </button>
            <button class="btn btn-secondary" onclick="shareCertificate()" id="shareBtn">
                <i class="fas fa-share-alt"></i> Share
            </button>
            <button class="btn btn-outline" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Dashboard
            </button>
        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============================================
        // AUTH HELPERS
        // ============================================
        function getCurrentUser() {
            const user = localStorage.getItem('nexora_current_user');
            return user ? JSON.parse(user) : null;
        }

        function getUsers() {
            const users = localStorage.getItem('nexora_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('nexora_users', JSON.stringify(users));
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const COURSES = {
            1: { id: 1, title: 'Computer Packages', code: 'CP' },
            2: { id: 2, title: 'Web Development', code: 'WD' },
            3: { id: 3, title: 'Python Programming', code: 'PY' },
            4: { id: 4, title: 'Graphic Design Masterclass', code: 'GD' },
            5: { id: 5, title: 'Digital Marketing', code: 'DM' },
            6: { id: 6, title: 'AI & Machine Learning', code: 'AI' },
            7: { id: 7, title: 'Data Analysis Professional', code: 'DA' },
            8: { id: 8, title: 'Cybersecurity Fundamentals', code: 'CY' },
            9: { id: 9, title: 'Mobile App Development', code: 'MA' }
        };

        // ============================================
        // GENERATE CERTIFICATE NUMBER
        // ============================================
        function generateCertificateNumber(courseCode, year) {
            const lastCert = localStorage.getItem('nexora_last_cert_number');
            let num = parseInt(lastCert) || 0;
            num++;
            localStorage.setItem('nexora_last_cert_number', num.toString());
            const serial = String(num).padStart(6, '0');
            return `NXA-${courseCode}-${year}-${serial}`;
        }

        // ============================================
        // GET TOTAL LESSONS FOR COURSE
        // ============================================
        function getTotalLessonsForCourse(courseId) {
            const totals = { 1: 85, 2: 118, 3: 30, 4: 28, 5: 32, 6: 25, 7: 30, 8: 28, 9: 32 };
            return totals[courseId] || 30;
        }

        // ============================================
        // GENERATE STUDENT ID
        // ============================================
        function generateStudentId() {
            const user = getCurrentUser();
            if (!user) return 'NXA-2026-000001';

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);
            if (userData && userData.studentId) {
                return userData.studentId;
            }

            const year = new Date().getFullYear();
            const lastId = localStorage.getItem('nexora_last_student_id');
            let num = parseInt(lastId) || 0;
            num++;
            localStorage.setItem('nexora_last_student_id', num.toString());
            const serial = String(num).padStart(6, '0');
            const studentId = `NXA-${year}-${serial}`;

            if (userData) {
                userData.studentId = studentId;
                saveUsers(users);
                localStorage.setItem('nexora_current_user', JSON.stringify(userData));
            }

            return studentId;
        }

        // ============================================
        // GENERATE GRADE
        // ============================================
        function generateGrade(progress) {
            if (progress >= 90) return { letter: 'A', label: 'Distinction' };
            if (progress >= 80) return { letter: 'B', label: 'Credit' };
            if (progress >= 70) return { letter: 'C', label: 'Pass' };
            if (progress >= 60) return { letter: 'D', label: 'Pass' };
            return { letter: 'F', label: 'Fail' };
        }

        // ============================================
        // LOAD CERTIFICATE
        // ============================================
        function loadCertificate() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            let courseId = urlParams.get('course');

            // If no course param, try to get latest certificate
            if (!courseId) {
                const users = getUsers();
                const userData = users.find(u => u.id === user.id);
                if (userData && userData.achievements) {
                    const certs = userData.achievements.filter(a => a.includes('Certificate - '));
                    if (certs.length > 0) {
                        const lastCert = certs[certs.length - 1];
                        const courseName = lastCert.replace('Certificate - ', '');
                        const course = Object.values(COURSES).find(c => c.title === courseName);
                        if (course) courseId = course.id;
                    }
                }
            }

            // If still no course, show message
            if (!courseId) {
                document.getElementById('certificateContainer').innerHTML = `
                            <div class="no-certificate">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificate Found</h3>
                                <p>Complete a course and meet all requirements to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                                </button>
                            </div>
                        `;
                document.getElementById('actionsContainer').style.display = 'none';
                return;
            }

            const course = COURSES[courseId];
            if (!course) {
                showToast('Course not found.', 'error');
                return;
            }

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);

            const completed = userData?.completedLessons?.[courseId] || [];
            const totalLessons = getTotalLessonsForCourse(courseId);
            const progress = totalLessons > 0 ? Math.round((completed.length / totalLessons) * 100) : 0;

            if (progress < 100) {
                showToast('Complete all lessons before generating certificate.', 'warning');
                document.getElementById('certificateContainer').innerHTML = `
                            <div class="no-certificate">
                                <i class="fas fa-clock"></i>
                                <h3>Course Not Complete</h3>
                                <p>You need to complete 100% of the course to earn your certificate.</p>
                                <p style="color:var(--gray);font-size:0.9rem;margin-top:0.5rem;">Current progress: ${progress}%</p>
                                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                                </button>
                            </div>
                        `;
                document.getElementById('actionsContainer').style.display = 'none';
                return;
            }

            // Generate certificate data
            const year = new Date().getFullYear();
            const certNumber = generateCertificateNumber(course.code, year);
            const issueDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const completionDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const studentId = userData?.studentId || generateStudentId();

            // Calculate grade
            const grade = generateGrade(progress);

            // Save certificate to user data
            if (userData) {
                if (!userData.certificates) userData.certificates = [];
                const existingCert = userData.certificates.find(c => c.courseId === courseId);
                if (!existingCert) {
                    userData.certificates.push({
                        courseId: courseId,
                        certNumber: certNumber,
                        issueDate: new Date().toISOString(),
                        studentId: studentId,
                        grade: grade.label,
                        score: progress
                    });
                    if (!userData.achievements) userData.achievements = [];
                    if (!userData.achievements.includes(`Certificate - ${course.title}`)) {
                        userData.achievements.push(`Certificate - ${course.title}`);
                    }
                    saveUsers(users);
                    localStorage.setItem('nexora_current_user', JSON.stringify(userData));
                } else {
                    // Use existing certificate data
                    existingCert.grade = grade.label;
                    existingCert.score = progress;
                    saveUsers(users);
                }
            }

            // Build verification data for QR
            const verificationData = {
                name: user.name,
                course: course.title,
                certificate: certNumber,
                studentId: studentId,
                issued: issueDate,
                completed: completionDate,
                grade: grade.label,
                status: 'valid'
            };

            // Build certificate HTML - Professional Design
            const certHTML = `
                        <div class="certificate" id="certificate">
                            <!-- Watermark -->
                            <div class="watermark">NEXORA</div>

                            <!-- Gold Corners -->
                            <div class="corner tl"></div>
                            <div class="corner tr"></div>
                            <div class="corner bl"></div>
                            <div class="corner br"></div>

                            <!-- Digital Security Stamp -->
                            <div class="digital-stamp">
                                <div class="stamp-icon">
                                    <i class="fas fa-certificate"></i>
                                </div>
                                <div class="stamp-text">
                                    NEXORA ACADEMY<br />
                                    OFFICIALLY<br />
                                    VERIFIED
                                </div>
                                <div class="stamp-year">${year}</div>
                            </div>

                            <!-- Header -->
                            <div class="header">
                                <div class="cert-number-top">
                                    Certificate No: <span>${certNumber}</span>
                                </div>
                                <div class="logo-text">
                                    <i class="fas fa-graduation-cap"></i> Nexora<span>Academy</span>
                                </div>
                                <div class="tagline">Learn • Build • Grow</div>
                            </div>

                            <!-- Title -->
                            <div class="title">
                                <h1>CERTIFICATE OF COMPLETION</h1>
                                <div class="gold-line"></div>
                            </div>

                            <!-- Body -->
                            <div class="body">
                                <div class="presented-text">This certificate is proudly presented to</div>
                                <div class="student-name">${user.name.toUpperCase()}</div>
                                <div class="for-text">for successfully completing the requirements of</div>
                                <div class="course-name">${course.title.toUpperCase()}</div>
                                <div class="achievement-text">
                                    Having successfully completed the prescribed learning activities, assessments,
                                    practical projects, and examination requirements of the course.
                                </div>

                                <!-- Result Section -->
                                <div class="result-section">
                                    <div class="result-item">
                                        Final Score: <span class="value">${progress}%</span>
                                    </div>
                                    <div class="result-item">
                                        Grade: <span class="value ${grade.label === 'Distinction' ? 'distinction' : ''}">${grade.label.toUpperCase()}</span>
                                    </div>
                                    <div class="result-item">
                                        Completed: <span class="value">${completionDate}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Signatures -->
                            <div class="footer-signatures">
                                <div class="signature">
                                    <div class="sig-name">Dr. Kelvin M. Ochieng</div>
                                    <div class="sig-line"></div>
                                    <div class="sig-title">ACADEMIC DIRECTOR</div>
                                </div>
                                <div class="signature">
                                    <div class="sig-name">REGISTRAR</div>
                                    <div class="sig-line"></div>
                                    <div class="sig-title">Nexora Academy</div>
                                </div>
                            </div>

                            <!-- QR Section -->
                            <div class="qr-section">
                                <div class="qr-code" id="qrCodeContainer">
                                    <!-- QR Code generated here -->
                                </div>
                                <div class="qr-info">
                                    <div class="qr-label">
                                        <i class="fas fa-qrcode"></i> Scan to Verify
                                    </div>
                                    <div class="qr-status">✅ VERIFIED</div>
                                </div>
                            </div>

                            <!-- Footer -->
                            <div class="cert-footer">
                                <div class="footer-text">
                                    Verify this certificate at the official Nexora Academy verification portal using the QR code or Certificate Number.
                                    <br />
                                    <a href="#" onclick="showToast('🔍 Verification page opened', 'info')">verify.nexoraacademy.com</a>
                                </div>
                                <div class="footer-cert-number">
                                    Certificate No: <span>${certNumber}</span>
                                </div>
                            </div>
                        </div>
                    `;

            // Render certificate
            document.getElementById('certificateContainer').innerHTML = certHTML;

            // Generate QR Code
            setTimeout(() => {
                const qrContainer = document.getElementById('qrCodeContainer');
                if (qrContainer) {
                    new QRCode(qrContainer, {
                        text: JSON.stringify(verificationData),
                        width: 80,
                        height: 80,
                        colorDark: '#0B1F3A',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }, 300);

            // Store data for download
            window._certData = {
                certNumber: certNumber,
                studentName: user.name.toUpperCase(),
                courseName: course.title.toUpperCase(),
                courseCode: course.code,
                issueDate: issueDate,
                completionDate: completionDate,
                studentId: studentId,
                grade: grade.label,
                score: progress,
                year: year,
                verificationData: verificationData
            };

            showToast('🎓 Certificate loaded successfully!', 'success');
        }

        // ============================================
        // DOWNLOAD PDF
        // ============================================
        function downloadPDF() {
            const certData = window._certData;
            if (!certData) {
                showToast('No certificate data found.', 'error');
                return;
            }

            showToast('📄 Preparing your certificate...', 'info', 2000);

            // Build certificate text content
            const certText = `
        ═══════════════════════════════════════════════════════════
                           NEXORA ACADEMY
                         Learn • Build • Grow
        ═══════════════════════════════════════════════════════════

                      CERTIFICATE OF COMPLETION

        ═══════════════════════════════════════════════════════════

        This certificate is proudly presented to

                        ${certData.studentName}

        for successfully completing the requirements of

                      ${certData.courseName}

        ═══════════════════════════════════════════════════════════

        Having successfully completed the prescribed learning
        activities, assessments, practical projects, and examination
        requirements of the course.

        ──────────────────────────────────────────────────────────

        Final Score:  ${certData.score}%
        Grade:        ${certData.grade.toUpperCase()}
        Completed:    ${certData.completionDate}

        ═══════════════════════════════════════════════════════════

        Certificate No:  ${certData.certNumber}
        Student ID:      ${certData.studentId}
        Date of Issue:   ${certData.issueDate}

        ──────────────────────────────────────────────────────────

                    Dr. Kelvin M. Ochieng
                    ACADEMIC DIRECTOR

                    REGISTRAR
                    Nexora Academy

        ═══════════════════════════════════════════════════════════

        Verify this certificate at:
        https://verify.nexoraacademy.com/verify/${certData.certNumber}

        Status: ✅ VALID

        ═══════════════════════════════════════════════════════════

        Nexora Academy • Learn • Build • Grow
        © ${certData.year} Nexora Academy. All Rights Reserved.

        ═══════════════════════════════════════════════════════════
        `;

            try {
                const blob = new Blob([certText], {
                    type: 'text/plain;charset=utf-8'
                });

                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Certificate-${certData.certNumber}.txt`;
                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                }, 1000);

                showToast('📄 Certificate downloaded successfully!', 'success');

            } catch (error) {
                try {
                    const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(certText);
                    const link = document.createElement('a');
                    link.href = dataUri;
                    link.download = `Certificate-${certData.certNumber}.txt`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('📄 Certificate downloaded!', 'success');
                } catch (fallbackError) {
                    showToast('Download failed. Please try again.', 'error');
                }
            }
        }

        // ============================================
        // SHARE CERTIFICATE
        // ============================================
        function shareCertificate() {
            const certData = window._certData;
            if (!certData) {
                showToast('No certificate data found.', 'error');
                return;
            }

            const shareText =
                `🎓 I earned my ${certData.courseName} certificate from Nexora Academy!\n\nCertificate ID: ${certData.certNumber}\nStudent: ${certData.studentName}\nGrade: ${certData.grade.toUpperCase()}\nScore: ${certData.score}%\n\nVerify at: https://verify.nexoraacademy.com/verify/${certData.certNumber}`;

            if (navigator.share) {
                navigator.share({
                        title: 'My Certificate - Nexora Academy',
                        text: shareText,
                        url: window.location.href
                    })
                    .then(() => showToast('✅ Shared successfully!', 'success'))
                    .catch(() => showToast('Share cancelled.', 'warning'));
            } else {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText)
                        .then(() => showToast('📋 Copied to clipboard!', 'success'))
                        .catch(() => showToast('Could not copy.', 'error'));
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = shareText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Copied to clipboard!', 'success');
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            loadCertificate();

            // Close mobile nav on link click
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    document.body.classList.remove('nav-open');
                });
            });
        });

        console.log('🎓 Nexora Academy - Professional Certificate System');
        console.log('✅ Navy + Gold + White design');
        console.log('✅ QR code verification');
        console.log('✅ Digital security stamp');
        console.log('✅ Auto-generated certificate number');
        console.log('✅ Grade and score display');
        console.log('✅ Professional signatures');
    </script>
