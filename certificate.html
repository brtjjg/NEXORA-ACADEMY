<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Certificate - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b5;
            --secondary: #00d4aa;
            --dark: #1a1a2e;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
        }

        body {
            background: var(--light-gray);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* ============================================
           CERTIFICATE
           ============================================ */
        .certificate {
            background: var(--white);
            border: 8px double var(--primary);
            border-radius: var(--radius);
            padding: 2rem 2rem 1.5rem;
            box-shadow: var(--shadow);
            position: relative;
        }

        .certificate::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 2px solid rgba(108, 60, 225, 0.08);
            border-radius: 8px;
            pointer-events: none;
        }

        .certificate .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 6rem;
            color: rgba(108, 60, 225, 0.03);
            font-weight: 900;
            pointer-events: none;
            letter-spacing: 20px;
            user-select: none;
        }

        .certificate .security-stamp {
            position: absolute;
            top: 15px;
            right: 20px;
            text-align: center;
            opacity: 0.5;
        }

        .certificate .security-stamp .stamp-icon {
            font-size: 2rem;
            color: var(--primary);
        }

        .certificate .security-stamp .stamp-text {
            font-size: 0.5rem;
            color: var(--gray);
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* Header */
        .certificate .header {
            text-align: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 0.8rem;
            margin-bottom: 0.8rem;
            position: relative;
        }

        .certificate .header .certificate-id {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.6rem;
            color: var(--gray);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .certificate .header .certificate-id span {
            color: var(--primary);
        }

        .certificate .header .academy-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 3px;
        }

        .certificate .header .academy-name i {
            color: var(--secondary);
        }

        .certificate .header .subtitle {
            font-size: 0.7rem;
            color: var(--gray);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 0.1rem;
        }

        /* Body */
        .certificate .body {
            text-align: center;
            padding: 0.3rem 0;
        }

        .certificate .body .cert-title {
            font-size: 0.9rem;
            color: var(--gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .certificate .body .student-name {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0.2rem 0 0.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .certificate .body .course-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
            margin: 0.1rem 0 0.2rem;
            letter-spacing: 2px;
        }

        .certificate .body .description {
            color: var(--gray);
            font-size: 0.8rem;
            margin: 0.2rem 0;
        }

        /* Requirements */
        .certificate .requirements {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.2rem;
            margin: 0.6rem 0;
            padding: 0.6rem;
            background: var(--light-gray);
            border-radius: 12px;
            border: 1px solid rgba(108, 60, 225, 0.05);
        }

        .certificate .requirements .req-item {
            text-align: center;
            font-size: 0.6rem;
            color: var(--gray);
            padding: 0.2rem 0;
        }

        .certificate .requirements .req-item i {
            color: var(--success);
            display: block;
            font-size: 0.8rem;
            margin-bottom: 0.1rem;
        }

        .certificate .requirements .req-item .req-label {
            font-weight: 600;
        }

        /* Footer Signatures */
        .certificate .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 2px solid var(--light-gray);
        }

        .certificate .footer .signature {
            text-align: center;
            flex: 1;
        }

        .certificate .footer .signature .line {
            width: 100px;
            height: 2px;
            background: var(--dark);
            margin: 0.3rem auto 0.1rem;
        }

        .certificate .footer .signature .name {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--dark);
        }

        .certificate .footer .signature .title {
            font-size: 0.6rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* QR Section */
        .certificate .qr-section {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 2px solid var(--light-gray);
        }

        .certificate .qr-section .qr-code {
            width: 70px;
            height: 70px;
            background: var(--white);
            border: 2px solid var(--light-gray);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 4px;
        }

        .certificate .qr-section .qr-code canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .certificate .qr-section .qr-info {
            flex: 1;
        }

        .certificate .qr-section .qr-info .cert-id {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--dark);
        }

        .certificate .qr-section .qr-info .cert-id span {
            color: var(--primary);
        }

        .certificate .qr-section .qr-info .qr-label {
            font-size: 0.6rem;
            color: var(--gray);
        }

        .certificate .qr-section .qr-info .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.55rem;
            font-weight: 600;
            background: var(--success);
            color: white;
            margin-top: 0.1rem;
            letter-spacing: 1px;
        }

        .certificate .qr-section .qr-info .student-id {
            font-size: 0.65rem;
            color: var(--gray);
            margin-top: 0.1rem;
        }

        .certificate .qr-section .qr-info .student-id span {
            color: var(--dark);
            font-weight: 600;
        }

        .certificate .validity-note {
            text-align: center;
            font-size: 0.6rem;
            color: var(--gray);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--light-gray);
            font-style: italic;
        }

        /* ============================================
           DOWNLOAD SECTION - MOBILE FRIENDLY
           ============================================ */
        .download-section {
            margin-top: 1.5rem;
        }

        .download-section .download-title {
            text-align: center;
            font-size: 1rem;
            color: var(--gray);
            margin-bottom: 0.8rem;
        }

        .download-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #00b894;
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-sm {
            padding: 10px 18px;
            font-size: 0.8rem;
            min-width: 120px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-mobile {
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid #f39c12;
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .certificate {
                padding: 1.2rem 1rem 1rem;
            }

            .certificate .header .certificate-id {
                position: static;
                text-align: center;
                display: block;
                margin-bottom: 0.3rem;
                font-size: 0.6rem;
            }

            .certificate .header .academy-name {
                font-size: 1.4rem;
            }

            .certificate .body .student-name {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }

            .certificate .body .course-name {
                font-size: 1.1rem;
            }

            .certificate .requirements {
                grid-template-columns: 1fr 1fr;
                padding: 0.5rem;
            }

            .certificate .requirements .req-item {
                font-size: 0.55rem;
            }

            .certificate .footer {
                flex-direction: column;
                align-items: center;
                gap: 0.8rem;
            }

            .certificate .footer .signature .line {
                width: 80px;
            }

            .certificate .qr-section {
                flex-direction: column;
                text-align: center;
            }

            .certificate .security-stamp {
                display: none;
            }

            .certificate .watermark {
                font-size: 3rem;
                letter-spacing: 10px;
            }

            .download-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                min-width: auto;
                padding: 16px;
                font-size: 1rem;
            }

            .container {
                padding: 0;
            }

            body {
                padding: 0.5rem;
            }

            .toast {
                font-size: 0.85rem;
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .certificate {
                padding: 0.8rem 0.6rem 0.8rem;
                border-width: 5px;
            }

            .certificate .header .academy-name {
                font-size: 1.1rem;
            }

            .certificate .body .student-name {
                font-size: 1.2rem;
            }

            .certificate .body .course-name {
                font-size: 0.95rem;
            }

            .certificate .requirements {
                grid-template-columns: 1fr;
                gap: 0.1rem;
                padding: 0.4rem;
            }

            .certificate .requirements .req-item {
                font-size: 0.5rem;
            }

            .certificate .qr-section .qr-code {
                width: 60px;
                height: 60px;
            }

            .btn {
                padding: 14px;
                font-size: 0.9rem;
            }
        }

        .hidden {
            display: none !important;
        }

        .no-certificate {
            text-align: center;
            padding: 2rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .no-certificate i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .no-certificate h3 {
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .no-certificate p {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        /* Loading spinner */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 1rem;
        }

        .loading-spinner i {
            font-size: 2rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="container">

        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loadingSpinner">
            <i class="fas fa-spinner"></i>
            <p>Generating your certificate...</p>
        </div>

        <!-- ==========================================
        CERTIFICATE
        ========================================== -->
        <div id="certificateContainer">
            <!-- Dynamic content -->
        </div>

    </div>

    <!-- ==========================================
    TOAST CONTAINER
    ========================================== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============================================
        // AUTH HELPERS
        // ============================================
        function getCurrentUser() {
            const user = localStorage.getItem('nexora_current_user');
            return user ? JSON.parse(user) : null;
        }

        function getUsers() {
            const users = localStorage.getItem('nexora_users');
            return users ? JSON.parse(users) : [];
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const COURSES = {
            1: { id: 1, title: 'Computer Packages', code: 'CP' },
            2: { id: 2, title: 'Web Design Bootcamp', code: 'WD' },
            3: { id: 3, title: 'Python Programming', code: 'PY' },
            4: { id: 4, title: 'Graphic Design Masterclass', code: 'GD' },
            5: { id: 5, title: 'Digital Marketing', code: 'DM' },
            6: { id: 6, title: 'AI & Machine Learning', code: 'AI' },
            7: { id: 7, title: 'Data Analysis Professional', code: 'DA' },
            8: { id: 8, title: 'Cybersecurity Fundamentals', code: 'CY' },
            9: { id: 9, title: 'Mobile App Development', code: 'MA' }
        };

        // ============================================
        // GENERATE CERTIFICATE NUMBER
        // ============================================
        function generateCertificateNumber(courseCode, year) {
            const lastCert = localStorage.getItem('nexora_last_cert_number');
            let num = parseInt(lastCert) || 0;
            num++;
            localStorage.setItem('nexora_last_cert_number', num.toString());
            const serial = String(num).padStart(6, '0');
            return `NXA-${courseCode}-${year}-${serial}`;
        }

        // ============================================
        // GENERATE QR CODE DATA URL
        // ============================================
        function generateQRDataURL(certData) {
            return new Promise((resolve) => {
                const qrContainer = document.createElement('div');
                const qr = new QRCode(qrContainer, {
                    text: JSON.stringify(certData),
                    width: 200,
                    height: 200,
                    colorDark: '#1a1a2e',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Wait for QR to render
                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if (canvas) {
                        resolve(canvas.toDataURL('image/png'));
                    } else {
                        resolve(null);
                    }
                }, 500);
            });
        }

        // ============================================
        // GENERATE CERTIFICATE HTML
        // ============================================
        function generateCertificateHTML(data) {
            return `
                        <div class="certificate" id="certificate">
                            <div class="watermark">NEXORA</div>

                            <div class="security-stamp">
                                <div class="stamp-icon">
                                    <i class="fas fa-certificate"></i>
                                </div>
                                <div class="stamp-text">
                                    OFFICIAL<br />
                                    DIGITAL SEAL<br />
                                    NEXORA<br />
                                    ACADEMY
                                </div>
                            </div>

                            <div class="header">
                                <div class="certificate-id">
                                    CERTIFICATE ID: <span>${data.certNumber}</span>
                                </div>
                                <div class="academy-name">
                                    <i class="fas fa-graduation-cap"></i> NEXORA ACADEMY
                                </div>
                                <div class="subtitle">CERTIFICATE OF COURSE COMPLETION</div>
                            </div>

                            <div class="body">
                                <div class="cert-title">This is to certify that</div>
                                <div class="student-name">${data.studentName}</div>
                                <div class="description">has successfully completed all the academic and graduation requirements for the course</div>
                                <div class="course-name">${data.courseName}</div>

                                <div class="requirements">
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">COURSE DURATION</span><br />
                                        Completed 100% of the course content
                                    </div>
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">DATE ISSUED</span><br />
                                        ${data.issueDate}
                                    </div>
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">STUDENT ID</span><br />
                                        ${data.studentId}
                                    </div>
                                </div>
                            </div>

                            <div class="footer">
                                <div class="signature">
                                    <div class="name">Dr. Kelvin M. Ochieng</div>
                                    <div class="line"></div>
                                    <div class="title">ACADEMIC DIRECTOR</div>
                                </div>
                                <div class="signature">
                                    <div class="name">REGISTRAR</div>
                                    <div class="line"></div>
                                    <div class="title">Nexora Academy</div>
                                </div>
                            </div>

                            <div class="qr-section">
                                <div class="qr-code" id="qrCodeContainer">
                                    <!-- QR Code will be inserted here -->
                                </div>
                                <div class="qr-info">
                                    <div class="cert-id">
                                        Certificate ID: <span>${data.certNumber}</span>
                                    </div>
                                    <div class="student-id">
                                        Student ID: <span>${data.studentId}</span>
                                    </div>
                                    <div class="qr-label">
                                        <i class="fas fa-qrcode"></i> Scan QR to verify authenticity
                                    </div>
                                    <div class="status-badge">
                                        ✅ VERIFIED
                                    </div>
                                </div>
                            </div>

                            <div class="validity-note">
                                This certificate is issued electronically and is valid without a signature.
                            </div>
                        </div>
                    `;
        }

        // ============================================
        // LOAD CERTIFICATE
        // ============================================
        async function loadCertificate() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            let courseId = urlParams.get('course');

            // If no course param, try to get latest certificate
            if (!courseId) {
                const users = getUsers();
                const userData = users.find(u => u.id === user.id);
                if (userData && userData.achievements) {
                    const certs = userData.achievements.filter(a => a.includes('Certificate - '));
                    if (certs.length > 0) {
                        const lastCert = certs[certs.length - 1];
                        const courseName = lastCert.replace('Certificate - ', '');
                        const course = Object.values(COURSES).find(c => c.title === courseName);
                        if (course) courseId = course.id;
                    }
                }
            }

            // If still no course, show message
            if (!courseId) {
                document.getElementById('certificateContainer').innerHTML = `
                            <div class="no-certificate">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificate Found</h3>
                                <p>Complete a course and meet all requirements to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                                </button>
                            </div>
                        `;
                return;
            }

            // Show loading
            document.getElementById('loadingSpinner').style.display = 'block';

            const course = COURSES[courseId];
            if (!course) {
                showToast('Course not found.', 'error');
                return;
            }

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);

            const completed = userData?.completedLessons?.[courseId] || [];
            const totalLessons = getTotalLessonsForCourse(courseId);
            const progress = totalLessons > 0 ? Math.round((completed.length / totalLessons) * 100) : 0;

            if (progress < 100) {
                showToast('Complete all lessons before generating certificate.', 'warning');
                document.getElementById('certificateContainer').innerHTML = `
                            <div class="no-certificate">
                                <i class="fas fa-clock"></i>
                                <h3>Course Not Complete</h3>
                                <p>You need to complete 100% of the course to earn your certificate.</p>
                                <p style="color:var(--gray);font-size:0.9rem;">Current progress: ${progress}%</p>
                                <button class="btn btn-primary" onclick="window.location.href='courses/computer-packages.html'">
                                    <i class="fas fa-arrow-left"></i> Continue Learning
                                </button>
                            </div>
                        `;
                document.getElementById('loadingSpinner').style.display = 'none';
                return;
            }

            // Generate certificate data
            const year = new Date().getFullYear();
            const certNumber = generateCertificateNumber(course.code, year);
            const issueDate = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const studentId = userData?.studentId || 'NXA-' + Date.now().toString().slice(-6);

            // Save certificate to user data
            if (userData) {
                if (!userData.certificates) userData.certificates = [];
                const existingCert = userData.certificates.find(c => c.courseId === courseId);
                if (!existingCert) {
                    userData.certificates.push({
                        courseId: courseId,
                        certNumber: certNumber,
                        issueDate: new Date().toISOString(),
                        studentId: studentId
                    });
                    if (!userData.achievements) userData.achievements = [];
                    if (!userData.achievements.includes(`Certificate - ${course.title}`)) {
                        userData.achievements.push(`Certificate - ${course.title}`);
                    }
                    localStorage.setItem('nexora_users', JSON.stringify(users));
                    localStorage.setItem('nexora_current_user', JSON.stringify(userData));
                }
            }

            const certData = {
                certNumber: certNumber,
                studentName: user.name.toUpperCase(),
                courseName: course.title.toUpperCase(),
                issueDate: issueDate,
                studentId: studentId,
                courseId: courseId
            };

            // Generate certificate HTML
            document.getElementById('certificateContainer').innerHTML = generateCertificateHTML(certData);

            // Generate QR Code
            const qrContainer = document.getElementById('qrCodeContainer');
            const qrData = {
                name: user.name,
                course: course.title,
                certificate: certNumber,
                studentId: studentId,
                issued: issueDate,
                verified: true
            };

            new QRCode(qrContainer, {
                text: JSON.stringify(qrData),
                width: 70,
                height: 70,
                colorDark: '#1a1a2e',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            // Hide loading
            document.getElementById('loadingSpinner').style.display = 'none';

            showToast('🎓 Certificate loaded successfully!', 'success');

            // Store for download
            window._certData = certData;
        }

        // ============================================
        // GET TOTAL LESSONS FOR COURSE
        // ============================================
        function getTotalLessonsForCourse(courseId) {
            const totals = { 1: 85, 2: 35, 3: 30, 4: 28, 5: 32, 6: 25, 7: 30, 8: 28, 9: 32 };
            return totals[courseId] || 30;
        }

        // ============================================
        // DOWNLOAD CERTIFICATE - MOBILE FRIENDLY
        // ============================================
        function downloadCertificate() {
            const certData = window._certData;
            if (!certData) {
                showToast('No certificate data found.', 'error');
                return;
            }

            showToast('📄 Preparing your certificate...', 'info', 2000);

            // Get the certificate element
            const certificateEl = document.getElementById('certificate');
            if (!certificateEl) {
                showToast('Certificate not found.', 'error');
                return;
            }

            // Get QR code image
            const qrCanvas = certificateEl.querySelector('#qrCodeContainer canvas');
            let qrDataURL = '';
            if (qrCanvas) {
                qrDataURL = qrCanvas.toDataURL('image/png');
            }

            // Build the certificate text content
            const certificateText = `
        ═══════════════════════════════════════════════════════════
                           NEXORA ACADEMY
        ═══════════════════════════════════════════════════════════

                    CERTIFICATE OF COURSE COMPLETION

        This is to certify that

                        ${certData.studentName}

        has successfully completed all the academic and graduation
        requirements for the course

                        ${certData.courseName}

        ═══════════════════════════════════════════════════════════

        Certificate ID:  ${certData.certNumber}
        Student ID:      ${certData.studentId}
        Date Issued:     ${certData.issueDate}

        ──────────────────────────────────────────────────────────

        Requirements Completed:
        ✅ Completed 100% of the course content
        ✅ Met the required attendance
        ✅ Completed all assignments
        ✅ Completed all individual projects
        ✅ Completed all required group projects
        ✅ Completed all required assessments
        ✅ Satisfied all graduation requirements
        ✅ Full course payment completed

        ──────────────────────────────────────────────────────────

        In recognition of your dedication, hard work, and successful
        completion of all requirements, this certificate is proudly
        awarded to you.

        ═══════════════════════════════════════════════════════════

                    Dr. Kelvin M. Ochieng
                    ACADEMIC DIRECTOR

                    REGISTRAR
                    Nexora Academy

        ═══════════════════════════════════════════════════════════

        This certificate is issued electronically and is valid
        without a signature.

        ═══════════════════════════════════════════════════════════

        QR Code Verification
        Scan to verify authenticity
        https://nexora.com/verify/${certData.certNumber}

        Verification Status: ✅ VALID

        ═══════════════════════════════════════════════════════════
        `;

            // Create a Blob with the certificate text
            const blob = new Blob([certificateText], {
                type: 'text/plain;charset=utf-8'
            });

            // Create download URL
            const url = URL.createObjectURL(blob);

            // Create a temporary anchor element
            const link = document.createElement('a');
            link.href = url;
            link.download = `Certificate-${certData.certNumber}.txt`;
            document.body.appendChild(link);

            // Trigger download - works on mobile
            link.click();

            // Clean up
            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 100);

            showToast('📄 Certificate downloaded successfully!', 'success');
        }

        // ============================================
        // DOWNLOAD TRANSCRIPT
        // ============================================
        function downloadTranscript() {
            const user = getCurrentUser();
            if (!user) {
                showToast('Please login first.', 'warning');
                return;
            }

            showToast('📊 Preparing your transcript...', 'info', 2000);

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);

            if (!userData) {
                showToast('User data not found.', 'error');
                return;
            }

            const enrolled = userData.enrolledCourses || [];
            const completedLessons = userData.completedLessons || {};
            const achievements = userData.achievements || [];

            let transcriptText = `
        ═══════════════════════════════════════════════════════════
                           NEXORA ACADEMY
                         OFFICIAL TRANSCRIPT
        ═══════════════════════════════════════════════════════════

        Student Name:     ${user.name}
        Student ID:       ${userData.studentId || 'NXA-2026-000123'}
        Email:            ${user.email || 'N/A'}
        Joined:           ${new Date(userData.joined).toLocaleDateString() || 'N/A'}

        ──────────────────────────────────────────────────────────

        ACADEMIC RECORD

        `;

            if (enrolled.length === 0) {
                transcriptText += `  No courses enrolled.\n\n`;
            } else {
                enrolled.forEach(courseId => {
                    const course = Object.values(COURSES).find(c => c.id === courseId);
                    if (!course) return;
                    const completed = completedLessons[courseId] || [];
                    const total = getTotalLessonsForCourse(courseId);
                    const progress = total > 0 ? Math.round((completed.length / total) * 100) : 0;
                    const status = progress === 100 ? '✅ COMPLETED' : '📖 IN PROGRESS';

                    transcriptText += `
        Course:           ${course.title}
        Progress:         ${progress}% (${completed.length}/${total} lessons)
        Status:           ${status}

        `;
                });
            }

            transcriptText += `
        ──────────────────────────────────────────────────────────

        ACHIEVEMENTS

        `;

            if (achievements.length === 0) {
                transcriptText += `  No achievements yet.\n\n`;
            } else {
                achievements.forEach(a => {
                    transcriptText += `  🏆 ${a}\n`;
                });
            }

            transcriptText += `
        ──────────────────────────────────────────────────────────

        SUMMARY

        Total Courses Enrolled:  ${enrolled.length}
        Total Achievements:      ${achievements.length}
        Total Learning Hours:    ${userData.learningHours || 0}h

        ──────────────────────────────────────────────────────────

        This transcript is official and verified by Nexora Academy.

        ═══════════════════════════════════════════════════════════

        Generated: ${new Date().toLocaleString()}
        Verification: https://nexora.com/verify/transcript-${userData.studentId || 'NXA'}

        ═══════════════════════════════════════════════════════════
        `;

            const blob = new Blob([transcriptText], {
                type: 'text/plain;charset=utf-8'
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Transcript-${userData.studentId || 'NXA-2026'}.txt`;
            document.body.appendChild(link);
            link.click();

            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 100);

            showToast('📊 Transcript downloaded successfully!', 'success');
        }

        // ============================================
        // SHARE CERTIFICATE (Mobile)
        // ============================================
        function shareCertificate() {
            const certData = window._certData;
            if (!certData) {
                showToast('No certificate data found.', 'error');
                return;
            }

            const shareData = {
                title: 'My Certificate - Nexora Academy',
                text: `🎓 I earned my ${certData.courseName} certificate from Nexora Academy!\n\nCertificate ID: ${certData.certNumber}\nStudent: ${certData.studentName}\n\nVerify at: https://nexora.com/verify/${certData.certNumber}`,
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData)
                    .then(() => showToast('✅ Shared successfully!', 'success'))
                    .catch(() => showToast('Share cancelled.', 'warning'));
            } else {
                // Fallback - copy to clipboard
                const text = shareData.text;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text)
                        .then(() => showToast('📋 Copied to clipboard! You can now share it.', 'success'))
                        .catch(() => showToast('Could not copy to clipboard.', 'error'));
                } else {
                    // Manual copy
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Copied to clipboard!', 'success');
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Add download buttons after certificate loads
            const observer = new MutationObserver(() => {
                const container = document.getElementById('certificateContainer');
                if (container.querySelector('.certificate') && !container.querySelector('.download-section')) {
                    const downloadSection = document.createElement('div');
                    downloadSection.className = 'download-section';
                    downloadSection.innerHTML = `
                                <div class="download-title">📄 Download & Share</div>
                                <div class="download-actions">
                                    <button class="btn btn-primary btn-mobile" onclick="downloadCertificate()">
                                        <i class="fas fa-download"></i> Download Certificate
                                    </button>
                                    <button class="btn btn-secondary btn-mobile" onclick="downloadTranscript()">
                                        <i class="fas fa-file-alt"></i> Download Transcript
                                    </button>
                                    <button class="btn btn-success btn-mobile" onclick="shareCertificate()">
                                        <i class="fas fa-share-alt"></i> Share Certificate
                                    </button>
                                    <button class="btn btn-outline btn-mobile" onclick="window.location.href='dashboard.html'">
                                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                                    </button>
                                </div>
                            `;
                    container.appendChild(downloadSection);
                }
            });

            observer.observe(document.getElementById('certificateContainer'), {
                childList: true,
                subtree: true
            });

            loadCertificate();
        });

        console.log('🎓 Nexora Academy - Certificate System');
        console.log('✅ Mobile-friendly download with share options');
    </script>
