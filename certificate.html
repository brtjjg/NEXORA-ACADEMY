<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>My Certificates - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b5;
            --secondary: #00d4aa;
            --dark: #1a1a2e;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
        }

        body {
            background: var(--light-gray);
            min-height: 100vh;
            padding: 0.8rem;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            background: var(--dark);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            color: white;
        }

        .navbar .logo {
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
        }

        .navbar .logo i {
            color: var(--secondary);
        }

        .navbar .logo span {
            color: var(--secondary);
        }

        .navbar .back-btn {
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .navbar .back-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           SEARCH
           ============================================ */
        .search-bar {
            background: var(--white);
            border-radius: 50px;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .search-bar i {
            color: var(--gray);
        }

        .search-bar input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 0.95rem;
            background: transparent;
        }

        .search-bar input::placeholder {
            color: var(--gray);
        }

        /* ============================================
           PAGE TITLE
           ============================================ */
        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .page-title h1 {
            font-size: 1.5rem;
            color: var(--dark);
        }

        .page-title h1 i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        /* ============================================
           CERTIFICATE CARDS
           ============================================ */
        .certificates-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .certificate-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
        }

        .certificate-card:hover {
            transform: translateX(4px);
        }

        .certificate-card .cert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .certificate-card .cert-header .cert-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
        }

        .certificate-card .cert-header .cert-title i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .certificate-card .cert-header .status {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 50px;
            font-weight: 600;
        }

        .status-verified {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .certificate-card .cert-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: var(--gray);
            margin: 0.5rem 0;
        }

        .certificate-card .cert-details span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .certificate-card .cert-details span i {
            width: 16px;
            color: var(--primary);
        }

        .certificate-card .cert-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-width: 100px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #00b894;
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
            min-width: 70px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-downloading {
            background: var(--warning);
            color: white;
            cursor: wait;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            font-size: 0.9rem;
            pointer-events: auto;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           LOADING OVERLAY
           ============================================ */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 4000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-overlay p {
            color: var(--white);
            margin-top: 1rem;
            font-size: 1rem;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           NO CERTIFICATES
           ============================================ */
        .no-certificates {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .no-certificates i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .no-certificates h3 {
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .no-certificates p {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 480px) {
            .certificate-card {
                padding: 1rem;
            }

            .certificate-card .cert-header {
                flex-direction: column;
                gap: 0.3rem;
            }

            .certificate-card .cert-header .cert-title {
                font-size: 1rem;
            }

            .certificate-card .cert-actions {
                flex-direction: column;
            }

            .certificate-card .cert-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .page-title h1 {
                font-size: 1.2rem;
            }

            .btn {
                padding: 12px;
                font-size: 0.9rem;
            }
        }

        @media (min-width: 768px) {
            .certificates-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .hidden {
            display: none !important;
        }

        /* Progress bar for download */
        .download-progress {
            display: none;
            width: 100%;
            height: 4px;
            background: var(--light-gray);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .download-progress.active {
            display: block;
        }

        .download-progress .bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Generating PDF...</p>
    </div>

    <div class="container" style="max-width:900px;margin:0 auto;">

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-graduation-cap"></i>
                Nexora<span>Academy</span>
            </div>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back
            </div>
        </nav>

        <!-- Page Title -->
        <div class="page-title">
            <h1><i class="fas fa-certificate"></i> My Certificates</h1>
            <span style="font-size:0.8rem;color:var(--gray);" id="certCount">0 certificates</span>
        </div>

        <!-- Search -->
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search certificates..." id="searchInput" onkeyup="searchCertificates()" />
        </div>

        <!-- Certificates Grid -->
        <div class="certificates-grid" id="certificatesGrid">
            <!-- Dynamic content -->
        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============================================
        // AUTH HELPERS
        // ============================================
        function getCurrentUser() {
            const user = localStorage.getItem('nexora_current_user');
            return user ? JSON.parse(user) : null;
        }

        function getUsers() {
            const users = localStorage.getItem('nexora_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('nexora_users', JSON.stringify(users));
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const COURSES = {
            1: { id: 1, title: 'Computer Packages', code: 'CP' },
            2: { id: 2, title: 'Web Design Bootcamp', code: 'WD' },
            3: { id: 3, title: 'Python Programming', code: 'PY' },
            4: { id: 4, title: 'Graphic Design Masterclass', code: 'GD' },
            5: { id: 5, title: 'Digital Marketing', code: 'DM' },
            6: { id: 6, title: 'AI & Machine Learning', code: 'AI' },
            7: { id: 7, title: 'Data Analysis Professional', code: 'DA' },
            8: { id: 8, title: 'Cybersecurity Fundamentals', code: 'CY' },
            9: { id: 9, title: 'Mobile App Development', code: 'MA' }
        };

        // ============================================
        // GENERATE CERTIFICATE NUMBER
        // ============================================
        function generateCertificateNumber(courseCode, year) {
            const lastCert = localStorage.getItem('nexora_last_cert_number');
            let num = parseInt(lastCert) || 0;
            num++;
            localStorage.setItem('nexora_last_cert_number', num.toString());
            const serial = String(num).padStart(6, '0');
            return `NXA-${courseCode}-${year}-${serial}`;
        }

        // ============================================
        // GET TOTAL LESSONS FOR COURSE
        // ============================================
        function getTotalLessonsForCourse(courseId) {
            const totals = { 1: 85, 2: 35, 3: 30, 4: 28, 5: 32, 6: 25, 7: 30, 8: 28, 9: 32 };
            return totals[courseId] || 30;
        }

        // ============================================
        // RENDER CERTIFICATES
        // ============================================
        function renderCertificates() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);

            if (!userData) {
                document.getElementById('certificatesGrid').innerHTML = `
                            <div class="no-certificates">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificates Found</h3>
                                <p>Complete a course to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='courses/computer-packages.html'">
                                    <i class="fas fa-arrow-left"></i> Start Learning
                                </button>
                            </div>
                        `;
                document.getElementById('certCount').textContent = '0 certificates';
                return;
            }

            // Get certificates from user data
            const certificates = userData.certificates || [];

            // Also check achievements for certificates
            const achievements = userData.achievements || [];
            const certAchievements = achievements.filter(a => a.includes('Certificate - '));

            // Merge and deduplicate
            const allCerts = [];
            const seen = new Set();

            certificates.forEach(c => {
                const key = c.certNumber || c.courseId;
                if (!seen.has(key)) {
                    seen.add(key);
                    allCerts.push({
                        courseId: c.courseId,
                        certNumber: c.certNumber || `NXA-${Date.now().toString().slice(-6)}`,
                        issueDate: c.issueDate || new Date().toISOString(),
                        studentId: c.studentId || userData.studentId || 'NXA-2026-000123',
                        verified: true
                    });
                }
            });

            // If no certificates in data, check achievements
            if (allCerts.length === 0 && certAchievements.length > 0) {
                certAchievements.forEach((certName, index) => {
                    const courseName = certName.replace('Certificate - ', '');
                    const course = Object.values(COURSES).find(c => c.title === courseName);
                    if (course) {
                        const year = new Date().getFullYear();
                        const certNumber = generateCertificateNumber(course.code, year);
                        allCerts.push({
                            courseId: course.id,
                            certNumber: certNumber,
                            issueDate: new Date().toISOString(),
                            studentId: userData.studentId || 'NXA-2026-000123',
                            verified: true
                        });
                    }
                });

                // Save certificates to user data
                if (allCerts.length > 0) {
                    userData.certificates = allCerts;
                    saveUsers(users);
                    localStorage.setItem('nexora_current_user', JSON.stringify(userData));
                }
            }

            // Update count
            document.getElementById('certCount').textContent = `${allCerts.length} certificate${allCerts.length !== 1 ? 's' : ''}`;

            if (allCerts.length === 0) {
                document.getElementById('certificatesGrid').innerHTML = `
                            <div class="no-certificates">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificates Yet</h3>
                                <p>Complete a course and meet all requirements to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-arrow-left"></i> Browse Courses
                                </button>
                            </div>
                        `;
                return;
            }

            // Render certificates
            const grid = document.getElementById('certificatesGrid');
            grid.innerHTML = allCerts.map((cert, index) => {
                const course = COURSES[cert.courseId];
                const courseName = course ? course.title : 'Unknown Course';
                const date = new Date(cert.issueDate).toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });

                return `
                            <div class="certificate-card" id="cert-${index}">
                                <div class="cert-header">
                                    <div class="cert-title">
                                        <i class="fas fa-certificate"></i> ${courseName}
                                    </div>
                                    <span class="status status-verified">✅ Verified</span>
                                </div>
                                <div class="cert-details">
                                    <span><i class="fas fa-id-card"></i> ID: ${cert.certNumber}</span>
                                    <span><i class="fas fa-calendar"></i> Issued: ${date}</span>
                                    <span><i class="fas fa-user"></i> ${user.name}</span>
                                </div>
                                <div class="cert-actions">
                                    <button class="btn btn-primary btn-sm" onclick="downloadPDF(${index})" id="downloadBtn-${index}">
                                        <i class="fas fa-file-pdf"></i> Download PDF
                                    </button>
                                    <button class="btn btn-outline btn-sm" onclick="verifyCertificate('${cert.certNumber}')">
                                        <i class="fas fa-qrcode"></i> Verify
                                    </button>
                                    <button class="btn btn-secondary btn-sm" onclick="shareCertificate('${cert.certNumber}', '${courseName}')">
                                        <i class="fas fa-share-alt"></i> Share
                                    </button>
                                </div>
                                <div class="download-progress" id="progress-${index}">
                                    <div class="bar" id="progressBar-${index}"></div>
                                </div>
                            </div>
                        `;
            }).join('');
        }

        // ============================================
        // SEARCH CERTIFICATES
        // ============================================
        function searchCertificates() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.certificate-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? '' : 'none';
            });
        }

        // ============================================
        // DOWNLOAD PDF - DIRECT APPROACH
        // ============================================
        function downloadPDF(index) {
            const btn = document.getElementById(`downloadBtn-${index}`);
            const progress = document.getElementById(`progress-${index}`);
            const progressBar = document.getElementById(`progressBar-${index}`);

            // Disable button and show progress
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            btn.classList.add('btn-downloading');
            progress.classList.add('active');

            // Get certificate data
            const users = getUsers();
            const user = getCurrentUser();
            const userData = users.find(u => u.id === user.id);
            const certs = userData?.certificates || [];

            if (index >= certs.length) {
                showToast('Certificate not found.', 'error');
                resetButton(btn, progress);
                return;
            }

            const cert = certs[index];
            const course = COURSES[cert.courseId];
            const courseName = course ? course.title : 'Unknown Course';
            const date = new Date(cert.issueDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Build certificate text
            const certText = `
        ═══════════════════════════════════════════════════════════
                           NEXORA ACADEMY
                    CERTIFICATE OF COURSE COMPLETION
        ═══════════════════════════════════════════════════════════

        This is to certify that

                        ${user.name.toUpperCase()}

        has successfully completed all the academic and graduation
        requirements for the course

                        ${courseName.toUpperCase()}

        ═══════════════════════════════════════════════════════════

        Certificate ID:  ${cert.certNumber}
        Student ID:      ${cert.studentId || userData.studentId || 'NXA-2026-000123'}
        Date Issued:     ${date}

        ──────────────────────────────────────────────────────────

        Requirements Completed:
        ✅ Completed 100% of the course content
        ✅ Met the required attendance
        ✅ Completed all assignments
        ✅ Completed all individual projects
        ✅ Completed all required group projects
        ✅ Completed all required assessments
        ✅ Satisfied all graduation requirements
        ✅ Full course payment completed

        ──────────────────────────────────────────────────────────

        In recognition of your dedication, hard work, and successful
        completion of all requirements, this certificate is proudly
        awarded to you.

        ═══════════════════════════════════════════════════════════

                    Dr. Kelvin M. Ochieng
                    ACADEMIC DIRECTOR

                    REGISTRAR
                    Nexora Academy

        ═══════════════════════════════════════════════════════════

        This certificate is issued electronically and is valid
        without a signature.

        ═══════════════════════════════════════════════════════════

        QR Code Verification: https://nexora.com/verify/${cert.certNumber}
        Verification Status: ✅ VALID

        ═══════════════════════════════════════════════════════════
        `;

            // Update progress
            progressBar.style.width = '30%';

            // Create file using Blob
            const blob = new Blob([certText], {
                type: 'text/plain;charset=utf-8'
            });

            progressBar.style.width = '70%';

            // Create download link
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Certificate-${cert.certNumber}.txt`;
            document.body.appendChild(link);

            progressBar.style.width = '90%';

            // Trigger download
            link.click();

            progressBar.style.width = '100%';

            // Clean up
            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                resetButton(btn, progress);
                showToast('📄 Certificate downloaded successfully!', 'success');
            }, 1000);
        }

        function resetButton(btn, progress) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download PDF';
            btn.classList.remove('btn-downloading');
            setTimeout(() => {
                progress.classList.remove('active');
                const bar = progress.querySelector('.bar');
                if (bar) bar.style.width = '0%';
            }, 500);
        }

        // ============================================
        // VERIFY CERTIFICATE
        // ============================================
        function verifyCertificate(certNumber) {
            showToast(`🔍 Verifying certificate ${certNumber}...`, 'info', 2000);
            setTimeout(() => {
                showToast('✅ Certificate verified! This is an official Nexora Academy certificate.', 'success');
            }, 1500);
        }

        // ============================================
        // SHARE CERTIFICATE
        // ============================================
        function shareCertificate(certNumber, courseName) {
            const user = getCurrentUser();
            if (!user) return;

            const shareText =
                `🎓 I earned my ${courseName} certificate from Nexora Academy!\n\nCertificate ID: ${certNumber}\nStudent: ${user.name}\n\nVerify at: https://nexora.com/verify/${certNumber}`;

            if (navigator.share) {
                navigator.share({
                        title: 'My Certificate - Nexora Academy',
                        text: shareText,
                        url: window.location.href
                    })
                    .then(() => showToast('✅ Shared successfully!', 'success'))
                    .catch(() => showToast('Share cancelled.', 'warning'));
            } else {
                // Copy to clipboard
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText)
                        .then(() => showToast('📋 Copied to clipboard!', 'success'))
                        .catch(() => showToast('Could not copy.', 'error'));
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = shareText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Copied to clipboard!', 'success');
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderCertificates();
        });

        console.log('🎓 Nexora Academy - My Certificates');
        console.log('✅ Direct download with progress tracking');
        console.log('✅ Works on mobile and desktop');
    </script>

</body>
</html>
