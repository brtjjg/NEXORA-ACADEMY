<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>My Certificates - Nexora Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5228b5;
            --secondary: #00d4aa;
            --gold: #c9a84c;
            --dark: #1a1a2e;
            --gray: #6b6b8a;
            --light-gray: #f0f0f7;
            --white: #ffffff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
        }

        body {
            background: var(--light-gray);
            min-height: 100vh;
            padding: 0.8rem;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ============================================
           NAVBAR
           ============================================ */
        .navbar {
            background: var(--dark);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar .logo {
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
        }

        .navbar .logo i {
            color: var(--secondary);
        }

        .navbar .logo span {
            color: var(--secondary);
        }

        .navbar .back-btn {
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar .back-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           PAGE TITLE
           ============================================ */
        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .page-title h1 {
            font-size: 1.5rem;
            color: var(--dark);
        }

        .page-title h1 i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .page-title .count {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* ============================================
           CERTIFICATE CARDS
           ============================================ */
        .certificates-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .certificate-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-card:hover {
            transform: translateX(4px);
        }

        .certificate-card .cert-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .certificate-card .cert-header .cert-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
        }

        .certificate-card .cert-header .cert-title i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .certificate-card .cert-header .status {
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 50px;
            font-weight: 600;
        }

        .status-verified {
            background: #d4edda;
            color: #155724;
        }

        .certificate-card .cert-details {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: var(--gray);
            margin: 0.5rem 0;
        }

        .certificate-card .cert-details span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .certificate-card .cert-details span i {
            width: 16px;
            color: var(--primary);
        }

        .certificate-card .cert-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-width: 100px;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #00b894;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
            min-width: 70px;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: var(--dark);
            color: var(--white);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 400px;
            width: 100%;
            font-size: 0.9rem;
            pointer-events: auto;
            font-family: 'Segoe UI', sans-serif;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid #f39c12;
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           CERTIFICATE VIEWER MODAL
           ============================================ */
        .viewer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }

        .viewer-modal.active {
            display: flex;
        }

        .viewer-modal .viewer-content {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 850px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            padding: 0;
            position: relative;
        }

        .viewer-modal .viewer-content .close-btn {
            position: sticky;
            top: 10px;
            float: right;
            background: var(--danger);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 10px 0 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .viewer-modal .viewer-content .close-btn:hover {
            background: #c0392b;
        }

        /* ============================================
           CERTIFICATE - EXACT MATCH WITH LOGOS
           ============================================ */
        .certificate-exact {
            background: var(--white);
            padding: 2.5rem 2.5rem 2rem;
            position: relative;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* Logo - Top Left */
        .certificate-exact .logo-top-left {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-exact .logo-top-left i {
            color: var(--secondary);
        }

        .certificate-exact .logo-top-left span {
            color: var(--secondary);
        }

        /* Certificate ID - Top Right */
        .certificate-exact .cert-id-top {
            text-align: right;
            font-size: 0.75rem;
            color: var(--gray);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-exact .cert-id-top span {
            color: var(--primary);
        }

        /* Main Title */
        .certificate-exact .main-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 0.2rem;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .certificate-exact .main-title i {
            color: var(--secondary);
        }

        .certificate-exact .sub-title {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Decorative Line with Diamonds */
        .certificate-exact .decorative-line {
            text-align: center;
            margin: 0.5rem 0 1.5rem;
        }

        .certificate-exact .decorative-line span {
            display: inline-block;
            width: 150px;
            height: 2px;
            background: var(--primary);
            position: relative;
        }

        .certificate-exact .decorative-line span::before,
        .certificate-exact .decorative-line span::after {
            content: '◆';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 0.7rem;
        }

        .certificate-exact .decorative-line span::before {
            left: -18px;
        }

        .certificate-exact .decorative-line span::after {
            right: -18px;
        }

        /* Body */
        .certificate-exact .body {
            text-align: center;
            padding: 0.5rem 0;
        }

        .certificate-exact .body .certifies-text {
            font-size: 1rem;
            color: var(--gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-exact .body .student-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0.3rem 0 0.1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .certificate-exact .body .completed-text {
            color: var(--gray);
            font-size: 0.95rem;
            margin: 0.2rem 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .certificate-exact .body .course-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0.2rem 0 0.5rem;
            letter-spacing: 3px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* Requirements Grid - Exact Match */
        .certificate-exact .requirements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem 2rem;
            margin: 1.2rem 0;
            padding: 1rem 1.5rem;
            background: var(--light-gray);
            border-radius: 12px;
            border: 1px solid rgba(108, 60, 225, 0.08);
        }

        .certificate-exact .requirements-grid .req-item {
            text-align: center;
            font-size: 0.7rem;
            color: var(--gray);
            padding: 0.3rem 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-exact .requirements-grid .req-item .req-label {
            font-weight: 700;
            color: var(--dark);
            display: block;
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.1rem;
        }

        .certificate-exact .requirements-grid .req-item i {
            color: var(--success);
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        /* Student ID */
        .certificate-exact .student-id-row {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gray);
            margin: 0.5rem 0 1rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .certificate-exact .student-id-row span {
            font-weight: 700;
            color: var(--dark);
            letter-spacing: 1px;
        }

        /* Recognition Text */
        .certificate-exact .recognition-text {
            text-align: center;
            font-size: 0.95rem;
            color: var(--gray);
            margin: 0.5rem 0 1rem;
            font-style: italic;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* Footer Signatures */
        .certificate-exact .footer-signatures {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--light-gray);
        }

        .certificate-exact .footer-signatures .signature {
            text-align: center;
            flex: 1;
        }

        .certificate-exact .footer-signatures .signature .line {
            width: 160px;
            height: 2px;
            background: var(--dark);
            margin: 0.5rem auto 0.2rem;
        }

        .certificate-exact .footer-signatures .signature .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--dark);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .certificate-exact .footer-signatures .signature .title {
            font-size: 0.7rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Validity Note */
        .certificate-exact .validity-note {
            text-align: center;
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--light-gray);
            font-style: italic;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ============================================
           VIEWER ACTIONS
           ============================================ */
        .viewer-actions {
            display: flex;
            gap: 0.8rem;
            padding: 1rem 1.5rem 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--white);
            border-radius: 0 0 var(--radius) var(--radius);
            border-top: 1px solid var(--light-gray);
        }

        .viewer-actions .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        /* ============================================
           NO CERTIFICATES
           ============================================ */
        .no-certificates {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-family: 'Segoe UI', sans-serif;
        }

        .no-certificates i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .no-certificates h3 {
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .no-certificates p {
            color: var(--gray);
            margin-bottom: 1.5rem;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .certificate-exact {
                padding: 1.5rem 1rem 1rem;
            }

            .certificate-exact .logo-top-left {
                position: static;
                text-align: center;
                font-size: 1.4rem;
                margin-bottom: 0.5rem;
            }

            .certificate-exact .main-title {
                font-size: 1.6rem;
            }

            .certificate-exact .body .student-name {
                font-size: 1.8rem;
                letter-spacing: 3px;
            }

            .certificate-exact .body .course-name {
                font-size: 1.3rem;
            }

            .certificate-exact .requirements-grid {
                grid-template-columns: 1fr 1fr;
                padding: 0.8rem;
                gap: 0.3rem 1rem;
            }

            .certificate-exact .requirements-grid .req-item {
                font-size: 0.6rem;
            }

            .certificate-exact .footer-signatures {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .certificate-exact .footer-signatures .signature .line {
                width: 100px;
            }

            .certificate-exact .cert-id-top {
                font-size: 0.6rem;
                text-align: center;
            }

            .viewer-modal .viewer-content {
                max-height: 98vh;
                border-radius: var(--radius);
            }

            .viewer-actions {
                flex-direction: column;
                padding: 1rem;
            }

            .viewer-actions .btn {
                min-width: auto;
            }

            .certificate-card {
                padding: 1rem;
            }

            .certificate-card .cert-header {
                flex-direction: column;
                gap: 0.3rem;
            }

            .certificate-card .cert-header .cert-title {
                font-size: 1rem;
            }

            .certificate-card .cert-actions {
                flex-direction: column;
            }

            .certificate-card .cert-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .page-title h1 {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .certificate-exact {
                padding: 1rem 0.6rem 0.8rem;
            }

            .certificate-exact .main-title {
                font-size: 1.2rem;
            }

            .certificate-exact .body .student-name {
                font-size: 1.3rem;
            }

            .certificate-exact .body .course-name {
                font-size: 1rem;
            }

            .certificate-exact .requirements-grid {
                grid-template-columns: 1fr;
                gap: 0.1rem;
                padding: 0.5rem;
            }

            .certificate-exact .requirements-grid .req-item {
                font-size: 0.55rem;
            }

            .certificate-exact .footer-signatures .signature .name {
                font-size: 0.8rem;
            }

            .certificate-exact .footer-signatures .signature .line {
                width: 80px;
            }
        }

        @media (min-width: 768px) {
            .certificates-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .hidden {
            display: none !important;
        }

        .viewer-modal .viewer-content::-webkit-scrollbar {
            width: 4px;
        }

        .viewer-modal .viewer-content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .viewer-modal .viewer-content::-webkit-scrollbar-track {
            background: var(--light-gray);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- ==========================================
    CERTIFICATE VIEWER MODAL
    ========================================== -->
    <div class="viewer-modal" id="viewerModal">
        <div class="viewer-content">
            <button class="close-btn" onclick="closeViewer()">
                <i class="fas fa-times"></i>
            </button>
            <div id="viewerBody">
                <!-- Certificate content loaded here -->
            </div>
            <div class="viewer-actions" id="viewerActions">
                <button class="btn btn-primary" onclick="downloadFromViewer()">
                    <i class="fas fa-download"></i> Download Certificate
                </button>
                <button class="btn btn-secondary" onclick="shareFromViewer()">
                    <i class="fas fa-share-alt"></i> Share
                </button>
                <button class="btn btn-outline" onclick="closeViewer()">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
    MAIN CONTENT
    ========================================== -->
    <div class="container">

        <nav class="navbar">
            <div class="logo" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-graduation-cap"></i>
                Nexora<span>Academy</span>
            </div>
            <div class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i> Back
            </div>
        </nav>

        <div class="page-title">
            <h1><i class="fas fa-certificate"></i> My Certificates</h1>
            <span class="count" id="certCount">0 certificates</span>
        </div>

        <div class="certificates-grid" id="certificatesGrid">
            <!-- Dynamic content -->
        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==========================================
    JAVASCRIPT
    ========================================== -->
    <script>
        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success', duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // ============================================
        // AUTH HELPERS
        // ============================================
        function getCurrentUser() {
            const user = localStorage.getItem('nexora_current_user');
            return user ? JSON.parse(user) : null;
        }

        function getUsers() {
            const users = localStorage.getItem('nexora_users');
            return users ? JSON.parse(users) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('nexora_users', JSON.stringify(users));
        }

        // ============================================
        // COURSE DATA
        // ============================================
        const COURSES = {
            1: { id: 1, title: 'Computer Packages', code: 'CP' },
            2: { id: 2, title: 'Web Design Bootcamp', code: 'WD' },
            3: { id: 3, title: 'Python Programming', code: 'PY' },
            4: { id: 4, title: 'Graphic Design Masterclass', code: 'GD' },
            5: { id: 5, title: 'Digital Marketing', code: 'DM' },
            6: { id: 6, title: 'AI & Machine Learning', code: 'AI' },
            7: { id: 7, title: 'Data Analysis Professional', code: 'DA' },
            8: { id: 8, title: 'Cybersecurity Fundamentals', code: 'CY' },
            9: { id: 9, title: 'Mobile App Development', code: 'MA' }
        };

        // ============================================
        // GENERATE CERTIFICATE NUMBER
        // ============================================
        function generateCertificateNumber(courseCode, year) {
            const lastCert = localStorage.getItem('nexora_last_cert_number');
            let num = parseInt(lastCert) || 0;
            num++;
            localStorage.setItem('nexora_last_cert_number', num.toString());
            const serial = String(num).padStart(6, '0');
            return `NXA-${courseCode}-${year}-${serial}`;
        }

        // ============================================
        // GENERATE STUDENT ID
        // ============================================
        function generateStudentId() {
            const user = getCurrentUser();
            if (!user) return 'NXA-2026-000001';

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);
            if (userData && userData.studentId) {
                return userData.studentId;
            }

            const year = new Date().getFullYear();
            const lastId = localStorage.getItem('nexora_last_student_id');
            let num = parseInt(lastId) || 0;
            num++;
            localStorage.setItem('nexora_last_student_id', num.toString());
            const serial = String(num).padStart(6, '0');
            const studentId = `NXA-${year}-${serial}`;

            if (userData) {
                userData.studentId = studentId;
                saveUsers(users);
                localStorage.setItem('nexora_current_user', JSON.stringify(userData));
            }

            return studentId;
        }

        // ============================================
        // GET TOTAL LESSONS FOR COURSE
        // ============================================
        function getTotalLessonsForCourse(courseId) {
            const totals = { 1: 85, 2: 35, 3: 30, 4: 28, 5: 32, 6: 25, 7: 30, 8: 28, 9: 32 };
            return totals[courseId] || 30;
        }

        // ============================================
        // RENDER CERTIFICATES
        // ============================================
        function renderCertificates() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const users = getUsers();
            const userData = users.find(u => u.id === user.id);

            if (!userData) {
                document.getElementById('certificatesGrid').innerHTML = `
                            <div class="no-certificates">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificates Found</h3>
                                <p>Complete a course to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='courses/computer-packages.html'">
                                    <i class="fas fa-arrow-left"></i> Start Learning
                                </button>
                            </div>
                        `;
                document.getElementById('certCount').textContent = '0 certificates';
                return;
            }

            const studentId = generateStudentId();
            const certificates = userData.certificates || [];
            const achievements = userData.achievements || [];
            const certAchievements = achievements.filter(a => a.includes('Certificate - '));

            const allCerts = [];
            const seen = new Set();

            certificates.forEach(c => {
                const key = c.certNumber || c.courseId;
                if (!seen.has(key)) {
                    seen.add(key);
                    allCerts.push({
                        courseId: c.courseId,
                        certNumber: c.certNumber || `NXA-${Date.now().toString().slice(-6)}`,
                        issueDate: c.issueDate || new Date().toISOString(),
                        studentId: c.studentId || studentId,
                        verified: true
                    });
                }
            });

            if (allCerts.length === 0 && certAchievements.length > 0) {
                certAchievements.forEach((certName) => {
                    const courseName = certName.replace('Certificate - ', '');
                    const course = Object.values(COURSES).find(c => c.title === courseName);
                    if (course) {
                        const year = new Date().getFullYear();
                        const certNumber = generateCertificateNumber(course.code, year);
                        allCerts.push({
                            courseId: course.id,
                            certNumber: certNumber,
                            issueDate: new Date().toISOString(),
                            studentId: studentId,
                            verified: true
                        });
                    }
                });

                if (allCerts.length > 0) {
                    userData.certificates = allCerts;
                    saveUsers(users);
                    localStorage.setItem('nexora_current_user', JSON.stringify(userData));
                }
            }

            document.getElementById('certCount').textContent = `${allCerts.length} certificate${allCerts.length !== 1 ? 's' : ''}`;

            if (allCerts.length === 0) {
                document.getElementById('certificatesGrid').innerHTML = `
                            <div class="no-certificates">
                                <i class="fas fa-certificate"></i>
                                <h3>No Certificates Yet</h3>
                                <p>Complete a course and meet all requirements to earn your certificate.</p>
                                <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                                    <i class="fas fa-arrow-left"></i> Browse Courses
                                </button>
                            </div>
                        `;
                return;
            }

            const grid = document.getElementById('certificatesGrid');
            grid.innerHTML = allCerts.map((cert, index) => {
                const course = COURSES[cert.courseId];
                const courseName = course ? course.title : 'Unknown Course';
                const date = new Date(cert.issueDate).toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });

                return `
                            <div class="certificate-card" onclick="viewCertificate(${index})">
                                <div class="cert-header">
                                    <div class="cert-title">
                                        <i class="fas fa-certificate"></i> ${courseName}
                                    </div>
                                    <span class="status status-verified">✅ Verified</span>
                                </div>
                                <div class="cert-details">
                                    <span><i class="fas fa-id-card"></i> ${cert.certNumber}</span>
                                    <span><i class="fas fa-calendar"></i> ${date}</span>
                                    <span><i class="fas fa-user"></i> ${user.name}</span>
                                </div>
                                <div class="cert-actions" onclick="event.stopPropagation();">
                                    <button class="btn btn-primary btn-sm" onclick="viewCertificate(${index})">
                                        <i class="fas fa-eye"></i> View
                                    </button>
                                    <button class="btn btn-success btn-sm" onclick="downloadCertificate(${index})">
                                        <i class="fas fa-download"></i> Download
                                    </button>
                                    <button class="btn btn-outline btn-sm" onclick="verifyCertificate('${cert.certNumber}')">
                                        <i class="fas fa-qrcode"></i> Verify
                                    </button>
                                </div>
                            </div>
                        `;
            }).join('');
        }

        // ============================================
        // VIEW CERTIFICATE - EXACT MATCH WITH LOGOS
        // ============================================
        let currentViewIndex = -1;
        let currentViewData = null;

        function viewCertificate(index) {
            const users = getUsers();
            const user = getCurrentUser();
            const userData = users.find(u => u.id === user.id);
            const certs = userData?.certificates || [];

            if (index >= certs.length) {
                showToast('Certificate not found.', 'error');
                return;
            }

            currentViewIndex = index;
            currentViewData = certs[index];

            const course = COURSES[currentViewData.courseId];
            const courseName = course ? course.title : 'Unknown Course';
            const date = new Date(currentViewData.issueDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const studentId = currentViewData.studentId || generateStudentId();

            // Build certificate HTML - EXACT MATCH TO DESIGN WITH LOGOS
            const certHTML = `
                        <div class="certificate-exact">
                            <!-- Logo - Top Left -->
                            <div class="logo-top-left">
                                <i class="fas fa-graduation-cap"></i> Nexora<span>Academy</span>
                            </div>

                            <!-- Certificate ID - Top Right -->
                            <div class="cert-id-top">
                                CERTIFICATE ID: <span>${currentViewData.certNumber}</span>
                            </div>

                            <!-- Main Title -->
                            <div class="main-title">
                                <i class="fas fa-graduation-cap"></i> NEXORA ACADEMY
                            </div>
                            <div class="sub-title">CERTIFICATE OF COURSE COMPLETION</div>

                            <!-- Decorative Line -->
                            <div class="decorative-line">
                                <span></span>
                            </div>

                            <!-- Body -->
                            <div class="body">
                                <div class="certifies-text">This is to certify that</div>
                                <div class="student-name">${user.name.toUpperCase()}</div>
                                <div class="completed-text">has successfully completed all the academic and graduation requirements for the course</div>
                                <div class="course-name">${courseName.toUpperCase()}</div>

                                <!-- Requirements Grid -->
                                <div class="requirements-grid">
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">COURSE DURATION</span>
                                        Completed 100% of the course content
                                        <br />Met the required attendance
                                    </div>
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">DATE ISSUED</span>
                                        ${date}
                                        <br />Completed all assignments
                                        <br />Completed all individual projects
                                    </div>
                                    <div class="req-item">
                                        <i class="fas fa-check-circle"></i>
                                        <span class="req-label">STUDENT ID</span>
                                        ${studentId}
                                        <br />Completed all required group projects
                                        <br />Completed all required assessments
                                        <br />Satisfied all graduation requirements
                                    </div>
                                </div>

                                <!-- Student ID Row -->
                                <div class="student-id-row">
                                    STUDENT ID: <span>${studentId}</span>
                                </div>

                                <!-- Recognition Text -->
                                <div class="recognition-text">
                                    In recognition of your dedication, hard work, and successful completion of<br />
                                    all requirements, this certificate is proudly awarded to you.
                                </div>
                            </div>

                            <!-- Footer Signatures -->
                            <div class="footer-signatures">
                                <div class="signature">
                                    <div class="name">Dr. Kelvin M. Ochieng</div>
                                    <div class="line"></div>
                                    <div class="title">ACADEMIC DIRECTOR</div>
                                </div>
                                <div class="signature">
                                    <div class="name">REGISTRAR</div>
                                    <div class="line"></div>
                                    <div class="title">Nexora Academy</div>
                                </div>
                            </div>

                            <!-- Validity Note -->
                            <div class="validity-note">
                                This certificate is issued electronically and is valid without a signature.
                            </div>
                        </div>
                    `;

            // Show in modal
            document.getElementById('viewerBody').innerHTML = certHTML;
            document.getElementById('viewerModal').classList.add('active');
            document.body.style.overflow = 'hidden';

            showToast('📄 Certificate loaded', 'info', 1500);
        }

        // ============================================
        // CLOSE VIEWER
        // ============================================
        function closeViewer() {
            document.getElementById('viewerModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            currentViewIndex = -1;
            currentViewData = null;
        }

        // ============================================
        // DOWNLOAD FROM VIEWER
        // ============================================
        function downloadFromViewer() {
            if (!currentViewData) {
                showToast('No certificate to download.', 'error');
                return;
            }
            downloadCertificate(currentViewIndex);
        }

        // ============================================
        // SHARE FROM VIEWER
        // ============================================
        function shareFromViewer() {
            if (!currentViewData) {
                showToast('No certificate to share.', 'error');
                return;
            }

            const user = getCurrentUser();
            const course = COURSES[currentViewData.courseId];
            const courseName = course ? course.title : 'Unknown Course';
            const studentId = currentViewData.studentId || generateStudentId();

            const shareText =
                `🎓 I earned my ${courseName} certificate from Nexora Academy!\n\nCertificate ID: ${currentViewData.certNumber}\nStudent: ${user.name}\nStudent ID: ${studentId}\n\nVerify at: verify.nexoraacademy.com`;

            if (navigator.share) {
                navigator.share({
                        title: 'My Certificate - Nexora Academy',
                        text: shareText,
                        url: window.location.href
                    })
                    .then(() => showToast('✅ Shared successfully!', 'success'))
                    .catch(() => showToast('Share cancelled.', 'warning'));
            } else {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareText)
                        .then(() => showToast('📋 Copied to clipboard!', 'success'))
                        .catch(() => showToast('Could not copy.', 'error'));
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = shareText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Copied to clipboard!', 'success');
                }
            }
        }

        // ============================================
        // DOWNLOAD CERTIFICATE
        // ============================================
        function downloadCertificate(index) {
            const users = getUsers();
            const user = getCurrentUser();
            const userData = users.find(u => u.id === user.id);
            const certs = userData?.certificates || [];

            if (index >= certs.length) {
                showToast('Certificate not found.', 'error');
                return;
            }

            const cert = certs[index];
            const course = COURSES[cert.courseId];
            const courseName = course ? course.title : 'Unknown Course';
            const date = new Date(cert.issueDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            const studentId = cert.studentId || generateStudentId();

            // Build certificate content - EXACT MATCH
            const certContent = `
        ═══════════════════════════════════════════════════════════
                           NEXORA ACADEMY
                    CERTIFICATE OF COURSE COMPLETION
        ═══════════════════════════════════════════════════════════

        CERTIFICATE ID: ${cert.certNumber}

        This is to certify that

                        ${user.name.toUpperCase()}

        has successfully completed all the academic and graduation
        requirements for the course

                        ${courseName.toUpperCase()}

        ──────────────────────────────────────────────────────────

        COURSE DURATION
        Completed 100% of the course content
        Met the required attendance

        DATE ISSUED
        ${date}
        Completed all assignments
        Completed all individual projects

        STUDENT ID
        ${studentId}
        Completed all required group projects
        Completed all required assessments
        Satisfied all graduation requirements

        ──────────────────────────────────────────────────────────

        In recognition of your dedication, hard work, and successful
        completion of all requirements, this certificate is proudly
        awarded to you.

        ═══════════════════════════════════════════════════════════

                    Dr. Kelvin M. Ochieng
                    ACADEMIC DIRECTOR

                    REGISTRAR
                    Nexora Academy

        ═══════════════════════════════════════════════════════════

        This certificate is issued electronically and is valid
        without a signature.

        ═══════════════════════════════════════════════════════════

        Verification: https://nexora.com/verify/${cert.certNumber}
        Status: ✅ VALID

        ═══════════════════════════════════════════════════════════
        `;

            try {
                const blob = new Blob([certContent], {
                    type: 'text/plain;charset=utf-8'
                });

                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Certificate-${cert.certNumber}.txt`;
                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                }, 1000);

                showToast('📄 Certificate downloaded successfully!', 'success');

            } catch (error) {
                try {
                    const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(certContent);
                    const link = document.createElement('a');
                    link.href = dataUri;
                    link.download = `Certificate-${cert.certNumber}.txt`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('📄 Certificate downloaded!', 'success');
                } catch (fallbackError) {
                    showToast('Download failed. Please try again.', 'error');
                }
            }
        }

        // ============================================
        // VERIFY CERTIFICATE
        // ============================================
        function verifyCertificate(certNumber) {
            showToast(`🔍 Verifying certificate ${certNumber}...`, 'info', 2000);
            setTimeout(() => {
                showToast('✅ Certificate verified! This is an official Nexora Academy certificate.', 'success');
            }, 1500);
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderCertificates();
        });

        console.log('🎓 Nexora Academy - Professional Digital Certificates');
        console.log('✅ Exact match to design with logos');
        console.log('✅ Student name from registration');
        console.log('✅ Student ID auto-generated');
        console.log('✅ All colors preserved');
    </script>
